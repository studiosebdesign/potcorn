<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1B1B">
<title>Pot'corn – le ciné qu'on choisit entre potes</title>
<meta name="description" content="Les séances près de chez toi en cartes à glisser, avec les bandes-annonces. Garde tes films, envoie ta sélection à tes potes sur WhatsApp et votez.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#1B1B1B;--ink2:#2A2A2A;--cream:#F4EFE6;--sand:#E6DFD2;--or:#F28C28;--teal:#2BB3A3;--red:#E5484D;--muted:#BDBDBD}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
a{color:var(--or)}
.wrap{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:10px 14px calc(100px + env(safe-area-inset-bottom))}
.demo{font-size:11px;text-align:center;color:#8f8f8f;line-height:1.5}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:'Rubik Mono One',sans-serif;font-size:20px;color:var(--cream);letter-spacing:.02em;text-decoration:none}
.logo i{font-style:normal;color:var(--or);margin:0 -.32em}
.tagline{font-size:11px;color:#9a9a9a;text-align:right}
.topbar{display:flex;gap:6px;align-items:stretch}
.tk{flex:1;min-width:0;border:0;border-radius:10px;padding:6px 9px;min-height:50px;text-align:left;color:var(--ink);display:flex;flex-direction:column;justify-content:center}
.tk small{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.tk b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-o{background:var(--or);flex:1.5}.tk-t{background:var(--teal)}.tk-c{background:var(--cream)}
.selbtn{flex:none;width:50px;border:0;border-radius:50%;background:var(--ink2);color:#fff;position:relative;display:flex;align-items:center;justify-content:center}
.count{position:absolute;top:-3px;right:-3px;background:var(--or);color:var(--ink);font-size:11px;font-weight:800;min-width:19px;height:19px;padding:0 4px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.stage{position:relative;display:flex;justify-content:center;min-height:500px}
.card{position:absolute;top:0;width:min(340px,100%);background:var(--cream);color:var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .25s ease}
.card.behind{transform:scale(.94) translateY(16px);filter:brightness(.65);pointer-events:none}
/* La carte du dessus donne sa hauteur à la zone ; celle de dessous est coupée à la même hauteur */
.card.front{position:relative}
.card.behind{bottom:0}
.stage.cards{min-height:0;margin-bottom:14px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--ink);color:var(--cream);font-family:'Rubik Mono One',sans-serif;font-size:11px}
.badge{font-family:Inter,sans-serif;font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--or);color:var(--ink);padding:3px 7px;border-radius:4px}
.media{position:relative;aspect-ratio:16/10;background:#000;cursor:pointer}
.media img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.media{overflow:hidden}
.media .pbg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(18px) brightness(.55)}
.media img.pfront{position:relative;width:100%;height:100%;object-fit:contain}
.noimg{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;color:#fff;font-family:'Rubik Mono One',sans-serif;font-size:18px;background:#2A2A2A}
a.chip{color:var(--ink);text-decoration:none}
.playbtn{position:absolute;right:12px;bottom:12px;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;pointer-events:none}
.backposter{position:absolute;top:8px;right:8px;z-index:2;border:0;border-radius:999px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;font-weight:700;padding:8px 12px;min-height:36px}
.ctitle{font-family:'Rubik Mono One',sans-serif;font-size:20px;line-height:1.1;padding:12px 14px 2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px 14px}
.stat{background:var(--sand);border-radius:8px;padding:6px 8px;min-width:0}
.stat small{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;color:#5A544B}
.stat b{display:block;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.dur{background:var(--ink);color:var(--cream)}.stat.dur small{color:var(--or)}.stat.dur b{font-size:19px;margin-top:0}
.stub{border-top:3px dashed var(--ink);margin-top:6px;padding:10px 14px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:13px;font-weight:800;background:var(--teal);color:var(--ink);border-radius:6px;padding:6px 9px}
.allo{margin-left:auto;font-size:12px;font-weight:700;color:#7C2D12}
.stamp{position:absolute;top:96px;z-index:3;font-family:'Rubik Mono One',sans-serif;font-size:24px;padding:6px 14px;border-radius:10px;border:4px solid;opacity:0;pointer-events:none;background:rgba(244,239,230,.92)}
.stamp.keep{left:16px;color:var(--teal);transform:rotate(-14deg)}
.stamp.nope{right:16px;color:var(--red);transform:rotate(14deg)}
.actions{display:flex;justify-content:center;align-items:center;gap:26px}
.rb{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rb.nope{border:2px solid var(--red);background:transparent;color:var(--red)}
.rb.keep{border:0;background:var(--teal);color:var(--ink)}
.rb.undo{width:46px;height:46px;border:1px solid #555;background:transparent;color:#ddd}
.rb:disabled{opacity:.3}
.hint{text-align:center;font-size:12px;color:var(--muted)}
.empty{position:static;text-align:center;padding:40px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-family:'Rubik Mono One',sans-serif;font-size:18px;margin:0}
.empty p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;width:100%;border-radius:999px;border:0;font-weight:800;font-size:16px;text-decoration:none}
.big.or{background:var(--or);color:var(--ink)}.big.ink{background:var(--ink);color:#fff}.big.cream{background:var(--cream);color:var(--ink)}
.big:disabled{opacity:.6}
.ghost{min-height:46px;width:100%;border-radius:999px;border:1px solid #555;background:transparent;color:#fff;font-size:14px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;background:var(--cream);color:var(--ink);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.grip{display:block;width:44px;height:5px;border-radius:3px;background:#BDB6A8;margin:0 auto 10px}
.sheet h2{font-family:'Rubik Mono One',sans-serif;font-size:17px;margin:4px 0 10px}
.sheet .note{font-size:13px;color:#5A544B;line-height:1.45;margin:0 0 8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-radius:12px;background:#fff;color:var(--ink);padding:12px 14px;margin:6px 0;font-weight:600;min-height:52px;text-align:left}
.opt.on{background:var(--ink);color:#fff}
.opt:disabled{opacity:.45;cursor:default}
.opt small{font-weight:500;font-size:12px;opacity:.7}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;margin:10px 0}
.field input{font:inherit;font-weight:400;min-height:46px;border-radius:10px;border:1px solid #BDB6A8;padding:0 12px;background:#fff;color:var(--ink)}
.preview{background:#fff;border:1px solid #E0D9CC;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;white-space:pre-line;word-break:break-word}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:#5A544B;margin-top:12px}
.pagehead{display:flex;align-items:center;gap:10px}
.iconbtn{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--ink2);color:#fff;display:flex;align-items:center;justify-content:center}
.pagehead h1{font-family:'Rubik Mono One',sans-serif;font-size:19px;margin:0}
.pagehead p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:12px}
.mini{background:var(--cream);color:var(--ink);border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.mini .thumb{position:relative;display:block;width:100%;aspect-ratio:16/10;border:0;padding:0;background:#000}
.mini .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mini .thumb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.mini .rm{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.mini .t{font-family:'Rubik Mono One',sans-serif;font-size:12px;line-height:1.2;padding:8px 10px 2px;min-height:calc(2 * 1.2em + 10px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .d{padding:0 10px;font-size:18px;font-weight:800}
.mini .s{flex:1;border-top:2px dashed var(--ink);margin-top:6px;padding:6px 10px 8px;font-size:12px;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--ink2);border-radius:12px;padding:8px 10px}
.row img{width:64px;height:40px;object-fit:cover;border-radius:6px}
.row .grow{flex:1;min-width:0;font-weight:600;font-size:14px}
.smallbtn{border:0;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:700;font-size:13px;padding:8px 12px;min-height:40px}
.vid{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.94);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:16px}
.vid iframe{width:100%;max-width:720px;margin:0 auto;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.vid .vclose{align-self:center;border:0;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:800;padding:12px 22px;min-height:48px}
.vcard{background:var(--cream);color:var(--ink);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.vtop{display:flex;gap:10px;padding:10px}
.vthumb{position:relative;width:120px;flex:none;aspect-ratio:16/10;border:0;padding:0;border-radius:8px;overflow:hidden;background:#000}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vinfo{min-width:0;display:flex;flex-direction:column;gap:3px}
.vinfo .t{font-family:'Rubik Mono One',sans-serif;font-size:14px;line-height:1.15}
.vinfo .m{font-size:12px;color:#5A544B}
.vinfo .d{font-size:20px;font-weight:800}
.vbar{border-top:2px dashed var(--ink);padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vbar .sea{font-size:12px;font-weight:700;flex:1;min-width:0}
.toggle{border:2px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font-weight:800;font-size:13px;padding:8px 14px;min-height:42px;display:flex;align-items:center;gap:6px}
.toggle.on{background:var(--teal);border-color:var(--teal)}
.results{background:var(--ink2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.results h2{font-family:'Rubik Mono One',sans-serif;font-size:15px;margin:0}
.res .l{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.res .bar{height:10px;border-radius:5px;background:#3A3A3A;margin-top:5px;overflow:hidden}
.res .bar span{display:block;height:100%;background:var(--or);border-radius:5px}
.res .n{font-size:12px;color:var(--muted);margin-top:4px}
.dark label.field{color:#fff}
.dark .field input{border-color:#555}
.msg{font-size:14px;line-height:1.5;color:var(--muted);margin:0}
.quote{background:var(--ink2);border-radius:12px;padding:10px 12px;font-style:italic}
.toast{pointer-events:none;position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:50;background:var(--cream);color:var(--ink);font-weight:700;font-size:14px;padding:12px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
/* ---------- Séance entre potes ---------- */
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:999px;border:2px solid var(--or);background:transparent;color:var(--or);font-weight:800;font-size:15px;text-decoration:none}
.recap{background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.45}
.how{margin:12px 0;padding-left:20px;font-size:13px;color:#5A544B;line-height:1.5}
.how li{margin:3px 0}
.linkbtn{border:0;background:transparent;color:var(--or);font-weight:700;font-size:13px;padding:8px 4px;min-height:40px;text-decoration:underline}
.kick{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--or)}
.ghead{background:var(--ink2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ghead .gt{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ghead h1{font-family:'Rubik Mono One',sans-serif;font-size:15px;line-height:1.25;margin:2px 0 0}
.ghead p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.invite{flex:none;display:flex;align-items:center;gap:6px;background:var(--teal);color:var(--ink);font-weight:800;font-size:13px;border-radius:999px;padding:8px 12px;min-height:42px;text-decoration:none}
.potes{display:flex;flex-wrap:wrap;gap:6px}
.pote{display:flex;align-items:center;gap:6px;background:#1F1F1F;border-radius:999px;padding:3px 10px 3px 3px;font-size:12px;font-weight:700}
.pote small{font-weight:600;color:var(--muted)}
.pote.done small{color:var(--teal)}
.av{width:26px;height:26px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--ink)}
.gbody{display:flex;flex-direction:column;gap:12px}
.gprog{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.stamp.coeur{left:50%;top:70px;color:var(--or);transform:translateX(-50%) rotate(-4deg);white-space:nowrap;font-size:20px}
.actions.g4{gap:16px}
.rb.coeur{width:56px;height:56px;border:0;background:var(--or);color:var(--ink)}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{border:2px solid #555;border-radius:999px;background:transparent;color:#fff;font-weight:700;font-size:14px;padding:8px 14px;min-height:44px}
.dchip.on{background:var(--or);border-color:var(--or);color:var(--ink)}
.lbl2{font-size:13px;font-weight:700;margin-top:4px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h2{font-family:'Rubik Mono One',sans-serif;font-size:15px;margin:8px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-family:Inter,sans-serif;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:4px;background:var(--teal);color:var(--ink)}
.tag.or{background:var(--or)}
.vcard.match{box-shadow:0 0 0 3px var(--teal)}
.vcard.chosen{box-shadow:0 0 0 3px var(--or)}
.vinfo .who{font-size:12px;color:#5A544B;line-height:1.35}
.vinfo .sc{font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.decide{border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;min-height:42px}
.decban{background:var(--teal);color:var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.decban .kick{color:var(--ink)}
.decban h2{font-family:'Rubik Mono One',sans-serif;font-size:19px;line-height:1.15;margin:0}
.decban p{margin:0;font-size:14px;font-weight:600}
.decban .linkbtn{color:var(--ink);align-self:center}
.pcard{background:var(--ink2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pcard .ph{display:flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}
.pcard .ph small{font-weight:600;color:var(--muted);font-size:12px}
.pcard .pl{font-size:13px;color:#ddd;line-height:1.5}
.pcard .pl b{color:var(--or)}
.roul{position:fixed;inset:0;z-index:45;background:rgba(27,27,27,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.roul .rt{font-family:'Rubik Mono One',sans-serif;font-size:24px;line-height:1.2;color:var(--cream);min-height:3.6em;display:flex;align-items:center;justify-content:center;max-width:420px}
.roul .rt.win{color:var(--or);animation:pop .45s ease}
.under{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:-4px}
.linkbtn.soft{color:#bbb;text-decoration:none;display:flex;align-items:center;gap:6px}
.linkbtn:disabled{opacity:.3}
.hint .or{color:var(--or);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.others{margin:6px 14px 0;background:#DDF3EF;color:#0F4F47;font-size:12px;font-weight:700;border-radius:8px;padding:6px 9px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mheart{font-size:11px;font-weight:700;color:var(--or);white-space:nowrap}
/* Animation d'aide : la carte montre qu'on peut la glisser à gauche, à droite et vers le haut */
.card.front.nudge{animation:nudge 2.8s ease-in-out}
.card.nudge .stamp.nope{animation:stN 2.8s ease-in-out}
.card.nudge .stamp.keep{animation:stK 2.8s ease-in-out}
.card.nudge .stamp.coeur{animation:stC 2.8s ease-in-out}
@keyframes nudge{0%,26%,54%,86%,100%{transform:none}12%{transform:translateX(-56px) rotate(-6deg)}40%{transform:translateX(56px) rotate(6deg)}70%{transform:translateY(-28px)}}
@keyframes stN{0%,26%,100%{opacity:0}12%{opacity:.9}}
@keyframes stK{0%,26%,54%,100%{opacity:0}40%{opacity:.9}}
@keyframes stC{0%,54%,86%,100%{opacity:0}70%{opacity:.9}}
/* ---------- Parcours en 3 étapes ---------- */
.stepk{font-size:13px;font-weight:700;color:#d6d6d6;margin-top:-2px}
.stepk span{color:var(--or);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.setline{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:14px;background:var(--cream);color:var(--ink);padding:10px 12px;min-height:52px;text-align:left;font-size:15px}
.setline svg{flex:none;color:var(--or)}
.setline .st{flex:1;min-width:0;line-height:1.3}
.setline .sm{flex:none;font-size:13px;font-weight:800;color:#7C2D12;text-decoration:underline}
.resume{display:flex;align-items:center;gap:8px;background:#21302E;color:#CFF3EC;border-radius:12px;padding:10px 12px;text-decoration:none;font-size:13px;font-weight:600;min-height:44px}
.resume span{flex:1}.resume b{color:var(--teal)}.resume svg{color:var(--teal);flex:none}
.gline{display:flex;align-items:center;gap:8px;background:var(--ink2);border-radius:12px;padding:10px 12px;font-size:14px;color:#ddd;line-height:1.3}
.gline svg{color:var(--or);flex:none}.gline b{color:#fff}
.tip{background:#2E2416;border:1px solid #5A3D1A;color:#F6D9B5;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.tip b{color:var(--or)}
.pagehead2 h1{font-family:'Rubik Mono One',sans-serif;font-size:19px;margin:0}
.pagehead2 p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.ctabar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:16px;margin-top:auto;background:linear-gradient(to bottom,rgba(27,27,27,0),var(--ink) 18px)}
.ctabar .linkbtn{color:#ddd}
.invcard{background:var(--cream);color:var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.invcard h2{font-family:'Rubik Mono One',sans-serif;font-size:18px;margin:0}
.invcard p{margin:0;font-size:14px;line-height:1.45;color:#3d3830}
.invcard .linkbtn{color:#7C2D12;align-self:center}
.okcard{background:#21302E;color:#CFF3EC;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.okcard svg{color:var(--teal);flex:none}
.waitcard{background:var(--ink2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.waitcard span{color:var(--muted);font-size:13px;line-height:1.45}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(20,20,20,.97);border-top:1px solid #333;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:0;background:transparent;color:#9a9a9a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px;min-height:60px;border-radius:12px;font-size:12px;font-weight:700}
.tab .n{width:26px;height:26px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.tab .l{display:flex;align-items:center;gap:4px;white-space:nowrap}
.tab .l i{font-style:normal;background:var(--or);color:var(--ink);border-radius:9px;min-width:18px;height:18px;padding:0 5px;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.tab.on{color:var(--or);background:#2A2118}
.tab.ok .n{background:var(--teal);border-color:var(--teal);color:var(--ink)}
.tab.lock{opacity:.5}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sheet .lbl{margin-top:16px}
.sheet .dchip{color:var(--ink);border-color:#BDB6A8;background:#fff}
.sheet .dchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sheet .dchip:disabled{opacity:.35}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
</style>

<body>
<div id="app" class="wrap"></div>

<!-- Configuration Firebase : elle se colle dans le fichier firebase-config.js -->
<script src="firebase-config.js"></script>
<script type="module">
/* Firebase sert à la « Séance entre potes » (choix en commun, sans compte).
   La configuration est dans firebase-config.js. Tant qu'elle est vide,
   le reste du site marche normalement et le mode entre potes est en attente. */
const FIREBASE_CONFIG = (typeof firebaseConfig !== 'undefined' && firebaseConfig && firebaseConfig.apiKey) ? firebaseConfig : null;
const FB_VERSION = '10.12.2';

/* ---------- Cinémas ----------
   Identifiants AlloCiné (on les trouve dans l'adresse de la page du cinéma
   sur allocine.fr : …salle_gen_csalle=B1139.html → B1139).
   Étape suivante : la recherche de cinéma dans toute la France. */
const CINEMAS = [
  { id: 'W9161', name: 'CinéToile – Ballancourt', short: 'CinéToile' },
  { id: 'B0053', name: 'Cinéma Arcel – Corbeil-Essonnes', short: 'Arcel Corbeil' },
  { id: 'B0059', name: 'CGR Évry', short: 'CGR Évry' },
  { id: 'B1139', name: 'Pathé Carré Sénart – IMAX', short: 'Pathé Sénart' }
];
const API = '/api/seances';
const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const HOURS = [
  { v: -1, l: 'Maintenant' }, { v: 0, l: 'Toute la journée' },
  { v: 840, l: '14 h' }, { v: 1020, l: '17 h' }, { v: 1140, l: '19 h' },
  { v: 1200, l: '20 h' }, { v: 1260, l: '21 h' }, { v: 1320, l: '22 h' }
];

/* ---------- Outils ---------- */
const $app = document.getElementById('app');
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ytId = yt => String(yt || '').replace(/[^A-Za-z0-9_-]/g, '');
const thumb = yt => `https://i.ytimg.com/vi/${ytId(yt)}/hqdefault.jpg`;
const embed = yt => `https://www.youtube-nocookie.com/embed/${ytId(yt)}?autoplay=1&playsinline=1&rel=0`;
const toMin = h => { const [a, b] = h.split(':').map(Number); return a * 60 + b; };
const fmtDur = m => m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m} min`;
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const safeUrl = u => /^https:\/\//.test(String(u || '')) ? String(u).replace(/["'()\\\s<>]/g, c => encodeURIComponent(c)) : '';
/* Image d'un film : image large (TMDB ou miniature de la bande-annonce), sinon affiche */
const wideImg = f => safeUrl(f.backdrop) || (f.yt ? thumb(f.yt) : '');
const anyImg = f => wideImg(f) || safeUrl(f.img) || safeUrl(f.poster);
function toast(t) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2800);
}
function b64enc(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64dec(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return JSON.parse(decodeURIComponent(escape(atob(s)))); }
const base = () => location.origin + location.pathname;
const BRAND = `<div class="brand"><a class="logo" href="./" aria-label="Pot'corn, accueil">
  <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="10" cy="9" r="5" fill="#F4EFE6"/><circle cx="17" cy="6" r="5.5" fill="#F4EFE6"/><circle cx="23" cy="10" r="4.5" fill="#F4EFE6"/>
    <path d="M6 12h20l-2.6 17H8.6z" fill="#F4EFE6"/>
    <path d="M10.5 12l1.2 17M16 12v17M21.5 12l-1.2 17" stroke="#F28C28" stroke-width="2.6"/>
  </svg><span>POT<i>'</i>CORN</span></a><span class="tagline">le ciné qu'on choisit<br>entre potes</span></div>`;
const CREDIT = `<div class="demo">Séances : AlloCiné · Bandes-annonces : TMDB et YouTube<br>Pot'corn n\u2019est ni approuvé ni certifié par TMDB</div>`;
const ICON = {
  x: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  xs: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  ok: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  oks: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  undo: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  cards: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="7" y="3" width="13" height="17" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h9"/></svg>',
  play: '<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z" fill="#fff"/></svg>',
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  send: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>',
  heart: '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.4-4.5-9.4-9.1C1.1 8.4 3.3 5 6.7 5c2 0 3.4 1.1 4.3 2.5C11.9 6.1 13.3 5 15.3 5c3.4 0 5.6 3.4 4.1 6.9C19.4 16.5 12 21 12 21z"/></svg>',
  hs: '<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-1px"><path fill="#F28C28" d="M12 21s-7.4-4.5-9.4-9.1C1.1 8.4 3.3 5 6.7 5c2 0 3.4 1.1 4.3 2.5C11.9 6.1 13.3 5 15.3 5c3.4 0 5.6 3.4 4.1 6.9C19.4 16.5 12 21 12 21z"/></svg>',
  group: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 5.4"/></svg>'
};

/* ---------- Dates et rythme du mardi ---------- */
const today = new Date(); today.setHours(0, 0, 0, 0);
const DAYS = [...Array(7)].map((_, i) => { const d = new Date(today); d.setDate(d.getDate() + i); return d; });
let LIMIT = (2 - today.getDay() + 7) % 7;   // nombre de jours jusqu'au prochain mardi
if (LIMIT === 0) LIMIT = 7;                  // le mardi, la semaine suivante est publiée
const dayOpen = i => i <= LIMIT;
function dayShort(i) { if (i === 0) return "Aujourd'hui"; if (i === 1) return 'Demain'; const d = DAYS[i]; return JOURS[d.getDay()].slice(0, 3) + '. ' + d.getDate(); }
function dayLong(i) { const d = DAYS[i]; return JOURS[d.getDay()] + ' ' + d.getDate(); }

/* ---------- État ---------- */
const S = {
  tab: 'films', sheet: null, playing: null,
  cin: store.get('cine:cin', CINEMAS[0].id), day: 0, hour: -1,
  prenom: store.get('cine:prenom', ''), mot: '', showRemoved: false, autoDone: false
};
if (!CINEMAS.some(c => c.id === S.cin)) S.cin = CINEMAS[0].id;
const cin = () => CINEMAS.find(c => c.id === S.cin) || CINEMAS[0];
const nowMin = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
const hourMin = () => S.hour === -1 ? (S.day === 0 ? nowMin() : 0) : S.hour;
function hourText() {
  if (S.hour === 0 || (S.hour === -1 && S.day !== 0)) return 'toute la journée';
  if (S.hour === -1) return 'dès maintenant';
  return 'dès ' + HOURS.find(h => h.v === S.hour).l;
}
function hourShort() {
  if (S.hour === -1) return S.day === 0 ? 'Maintenant' : 'Journée';
  if (S.hour === 0) return 'Journée';
  return HOURS.find(h => h.v === S.hour).l;
}
const listKey = () => `cine:${S.cin}:${iso(DAYS[S.day])}`;
const getList = () => store.get(listKey(), { kept: [], removed: [], hist: [] });
const saveList = L => store.set(listKey(), L);

/* ---------- Chargement des séances (fonction serveur) ---------- */
const DATA = {};   // id du cinéma -> { status: 'loading' | 'ok' | 'error', films, error }
async function loadCinema(id, force) {
  if (!force && DATA[id] && DATA[id].status !== 'error') return;
  DATA[id] = { status: 'loading' };
  if (S.cin === id && !G.on) render();
  try {
    const r = await fetch(`${API}?cinema=${encodeURIComponent(id)}`);
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) throw new Error(j.error || 'Erreur ' + r.status);
    DATA[id] = { status: 'ok', films: j.films || [], stale: !!j.stale };
    if (j.pending) completeTrailers(id, 0);
  } catch (e) {
    DATA[id] = { status: 'error', error: e.message };
  }
  if (S.cin !== id || G.on) return;
  // Plus aucune séance aujourd'hui (ex. tard le soir) : on passe à demain, une seule fois
  if (!S.autoDone && S.day === 0 && S.hour === -1 && DATA[id].status === 'ok' && !filmsFor().length && DATA[id].films.length) {
    S.autoDone = true; S.day = 1; S.hour = 0; render(); toast('Plus de séance aujourd’hui : voici demain'); return;
  }
  S.autoDone = true;
  render();
}
/* Les bandes-annonces sont cherchées par petits paquets côté serveur :
   tant qu'il en manque, on redemande (6 fois au plus) et on met les cartes à jour. */
async function completeTrailers(id, n) {
  if (n >= 6) return;
  await new Promise(r => setTimeout(r, 700));
  try {
    const j = await fetch(`${API}?cinema=${encodeURIComponent(id)}`).then(r => r.json());
    if (j && Array.isArray(j.films) && DATA[id] && DATA[id].status === 'ok') {
      DATA[id].films = j.films;
      if (S.cin === id && !G.on && !S.playing && !S.sheet && !document.querySelector('.vid')) render();
      if (j.pending) completeTrailers(id, n + 1);
    }
  } catch (e) {}
}
function filmsFor() {
  const D = DATA[S.cin]; if (!D || D.status !== 'ok') return [];
  const di = iso(DAYS[S.day]); const m = hourMin();
  return D.films.map(f => ({ ...f, s: f.s.filter(x => x.d === di && toMin(x.h) >= m) })).filter(f => f.s.length);
}
function filmsOfDay() {
  const D = DATA[S.cin]; if (!D || D.status !== 'ok') return [];
  const di = iso(DAYS[S.day]), m = S.day === 0 ? nowMin() : 0;
  return D.films.map(f => ({ ...f, s: f.s.filter(x => x.d === di && toMin(x.h) >= m) })).filter(f => f.s.length);
}
function isNew(f, day = DAYS[S.day]) {
  const sd = String(f.sortie || '').slice(0, 10); if (!/^\d{4}-\d{2}-\d{2}$/.test(sd)) return false;
  const diff = (day - new Date(sd + 'T00:00:00')) / 86400000;
  return diff >= 0 && diff < 7;
}
const lab = x => x.h + (x.v !== 'VF' ? ' ' + x.v : '') + (x.ap ? ' AVP' : '');
const seaTxt = f => f.s.map(lab).join(' · ');

/* =====================================================================
   PARCOURS EN 3 ÉTAPES (barre du bas)
   ① Les films (je choisis)  ② Ma sélection (je valide / j'invite)  ③ Résultats
   ===================================================================== */
Object.assign(ICON, {
  pin: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  lock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
});
const dayText = i => i === 0 ? 'aujourd’hui' : i === 1 ? 'demain' : dayLong(i);
function stepKick(n, label) { return `<div class="stepk"><span>Étape ${n} sur 3</span> · ${label}</div>`; }
function navHTML(tab, o = {}) {
  const it = (k, n, label, x = {}) => `<button class="tab${tab === k ? ' on' : ''}${x.ok ? ' ok' : ''}${x.lock ? ' lock' : ''}" data-act="tab" data-v="${k}"${tab === k ? ' aria-current="step"' : ''}>
      <span class="n">${x.ok ? ICON.oks : x.lock ? ICON.lock : n}</span><span class="l">${label}${x.cnt ? `<i>${x.cnt}</i>` : ''}</span></button>`;
  return `<nav class="nav" aria-label="Les étapes"><div class="in">${it('films', 1, 'Les films', { ok: o.okFilms })}${it('sel', 2, 'Ma sélection', { ok: o.okSel, cnt: o.cnt })}${it('res', 3, 'Résultats', { lock: o.lockRes })}</div></nav>`;
}
/* Réglages lisibles en une ligne (cinéma · jour · heure) */
function setLine() {
  return `<button class="setline" data-act="sheet" data-v="set" aria-label="Modifier le cinéma, le jour ou l'heure">${ICON.pin}
    <span class="st"><b>${esc(cin().short)}</b> · ${esc(dayText(S.day))} · ${esc(hourText())}</span><span class="sm">Modifier</span></button>`;
}
function resumeHTML() {
  const lg = store.get('cine:lastGroup', null);
  if (!lg || !lg.code || lg.jour < iso(new Date())) return '';
  return `<a class="resume" href="${base()}?g=${esc(lg.code)}">${ICON.group}<span>Tu as une séance entre potes en cours</span><b>Voir ›</b></a>`;
}
function selGrid(films, coeur, rmAct) {
  return `<div class="grid">${films.map(f => `<div class="mini">
      <button class="rm" data-act="${rmAct}" data-v="${esc(f.id)}" aria-label="Retirer ${esc(f.t)}">${ICON.xs}</button>
      ${f.yt ? `<button class="thumb" data-act="video" data-v="${esc(f.yt)}" aria-label="Bande-annonce de ${esc(f.t)}"><img src="${anyImg(f)}" alt="" onerror="this.style.visibility='hidden'"><span>${ICON.play}</span></button>` : `<div class="thumb"><img src="${anyImg(f)}" alt="" onerror="this.style.visibility='hidden'"></div>`}
      <div class="t">${esc(f.t)}</div><div class="d">${f.d ? fmtDur(f.d) : '—'}${f.id === coeur ? ` <span class="mheart">${ICON.hs} coup de cœur</span>` : ''}</div><div class="s">${seaTxt(f) || '—'}</div></div>`).join('')}</div>`;
}
function removedHTML(films, act, open) {
  if (!films.length) return '';
  return `<button class="ghost" data-act="toggleRemoved">${open ? 'Masquer' : 'Revoir'} les films éliminés (${films.length})</button>` +
    (open ? `<div class="list">${films.map(f => `<div class="row"><img src="${anyImg(f)}" alt="" onerror="this.style.visibility='hidden'"><div class="grow">${esc(f.t)}${f.d ? ' · ' + fmtDur(f.d) : ''}</div><button class="smallbtn" data-act="${act}" data-v="${esc(f.id)}">Garder</button></div>`).join('')}</div>` : '');
}
/* Heures proposées au moment de valider */
function dispoOptions(today) {
  const now = today ? nowMin() : 0;
  const o = [{ v: now, l: now ? 'Dès maintenant' : 'Peu importe' }];
  for (const h of [840, 960, 1020, 1080, 1140, 1200, 1260, 1320]) if (h > now + 15) o.push({ v: h, l: 'Dès ' + hm(h) });
  return o;
}
const VAL = { prenom: null, dispo: null };   // la feuille « Valider » (prénom + heure)
function validSheetBody(group) {
  const opts = dispoOptions(group ? gToday() : S.day === 0);
  if (VAL.prenom == null) VAL.prenom = S.prenom;
  if (VAL.dispo == null || !opts.some(o => o.v === VAL.dispo)) {
    const pref = group ? (G.me && G.me.dispo) : (S.hour > 0 ? S.hour : null);
    VAL.dispo = opts.some(o => o.v === pref) ? pref : opts[0].v;
  }
  return `<h2>${group ? 'Valider mes choix' : 'Valider et inviter mes potes'}</h2>
    <label class="field">Ton prénom<input id="v-prenom" type="text" maxlength="30" autocomplete="given-name" value="${esc(VAL.prenom)}" placeholder="Ex. : ${group ? 'Julie' : 'Seb'}"></label>
    <div class="lbl">TU ES DISPO À PARTIR DE QUAND ?</div>
    <div class="chips2">${opts.map(o => `<button class="dchip${o.v === VAL.dispo ? ' on' : ''}" data-act="vdispo" data-v="${o.v}" aria-pressed="${o.v === VAL.dispo}">${o.l}</button>`).join('')}</div>
    <p class="note" style="margin-top:12px">${group ? 'Tes potes verront ton prénom et tes choix. Tu pourras encore les modifier.' : 'Ta séance va être créée : il ne restera plus qu’à envoyer le lien à tes potes.'}</p>
    <button class="big ink" data-act="validok">${group ? 'Valider et voir les résultats' : 'Valider'}</button>`;
}

/* ---------- Carte de film ---------- */
/* ctx (mode entre potes) : { group: true, playing: id du film en lecture, date: jour de la séance, others: bandeau « gardé par » } */
function cardHTML(f, num, total, isTop, ctx = {}) {
  const vers = [...new Set(f.s.map(x => x.v))].join(' · ');
  const playing = isTop && (ctx.group ? ctx.playing : S.playing) === f.id && f.yt;
  const wide = wideImg(f), poster = safeUrl(f.poster);
  const picture = wide
    ? `<img src="${wide}" alt="" onerror="this.style.visibility='hidden'">`
    : poster
      ? `<div class="pbg" style="background-image:url(${poster})"></div><img class="pfront" src="${poster}" alt="" onerror="this.style.visibility='hidden'">`
      : `<div class="noimg">${esc(f.t)}</div>`;
  const media = playing
    ? `<iframe src="${embed(f.yt)}" title="Bande-annonce de ${esc(f.t)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
       <button class="backposter" data-act="stop">Revenir à l'affiche</button>`
    : picture + (f.yt ? `<span class="playbtn">${ICON.play}</span>` : '');
  const allo = safeUrl(f.allo) || `https://www.allocine.fr/rechercher/?q=${encodeURIComponent(f.t)}`;
  return `<article class="card ${isTop ? 'front' : 'behind'}" data-id="${esc(f.id)}" aria-label="${esc(f.t)}">

/* Animation d'aide : si on ne touche à rien, la carte se balance pour montrer qu'on peut la glisser */
let _nudgeT = null, _swipes = 0;
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function armNudge() {
  clearTimeout(_nudgeT);
  _nudgeT = setTimeout(nudge, _swipes < 2 ? 2500 : 9000);
}
function nudge() {
  const el = document.querySelector('.card.front');
  if (!el) return;
  if (reduceMotion() || el.dataset.flying || el.querySelector('iframe') || document.querySelector('.sheet, .vid, .roul')) return armNudge();
  el.classList.remove('nudge'); void el.offsetWidth; el.classList.add('nudge');
  el.addEventListener('animationend', () => { el.classList.remove('nudge'); armNudge(); }, { once: true });
}
document.addEventListener('pointerdown', () => { document.querySelector('.card.nudge')?.classList.remove('nudge'); armNudge(); }, true);

/* ---------- Glisser la carte ----------
   opt.onDecide('keep' | 'nope' | 'coeur'), opt.onTap(id), opt.up = glisser vers le haut autorisé (coup de cœur) */
function attachSwipe(el, opt) {
  let x0 = 0, y0 = 0, dx = 0, dy = 0, down = false, onMedia = false;
  const keep = el.querySelector('.stamp.keep'), nope = el.querySelector('.stamp.nope'), coeur = el.querySelector('.stamp.coeur');
  const upward = () => opt.up && dy < 0 && -dy > Math.abs(dx);
  const reset = () => { el.style.transition = ''; el.style.transform = ''; keep.style.opacity = 0; nope.style.opacity = 0; if (coeur) coeur.style.opacity = 0; };
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('a,button,iframe')) return;
    down = true; dx = dy = 0; x0 = e.clientX; y0 = e.clientY;
    onMedia = !!e.target.closest('.media'); el.classList.remove('nudge');
    el.style.transition = 'none';
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
  });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    el.style.transform = `translate(${dx}px, ${opt.up ? Math.min(dy, 40) : dy * 0.15}px) rotate(${dx / 18}deg)`;
    const up = upward();
    keep.style.opacity = up ? 0 : Math.max(0, Math.min(1, dx / 110));
    nope.style.opacity = up ? 0 : Math.max(0, Math.min(1, -dx / 110));
    if (coeur) coeur.style.opacity = up ? Math.max(0, Math.min(1, -dy / 110)) : 0;
  });
  const end = () => {
    if (!down) return; down = false;
    el.style.transition = '';
    if (upward() && dy < -110) return opt.onDecide('coeur');
    if (dx > 110) return opt.onDecide('keep');
    if (dx < -110) return opt.onDecide('nope');
    reset();
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && onMedia) opt.onTap(el.dataset.id);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', () => { down = false; reset(); });
}
/* Fait partir la carte du dessus, puis appelle cb(id du film) */
function flyOut(dir, cb) {
  const el = document.querySelector('.card.front'); if (!el || el.dataset.flying) return;
  el.dataset.flying = '1';
  const id = el.dataset.id;
  el.style.transition = 'transform .3s ease';
  el.style.transform = dir === 'coeur' ? 'translate(0, -900px) rotate(-4deg)'
    : `translate(${dir === 'keep' ? 640 : -640}px, 40px) rotate(${dir === 'keep' ? 24 : -24}deg)`;
  const st = el.querySelector('.stamp.' + dir); if (st) st.style.opacity = 1;
  setTimeout(() => cb(id), 280);
}

function decide(dir) {

let _fb = null;
async function getFB() {
  if (!FIREBASE_CONFIG) return null;
  if (_fb) return _fb;
  const u = n => `https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-${n}.js`;
  const [app, auth, fs] = await Promise.all([import(u('app')), import(u('auth')), import(u('firestore'))]);

  _fb = { db: fs.getFirestore(a), uid: au.currentUser.uid, fs };
  return _fb;

/* =====================================================================
   SÉANCE ENTRE POTES
   Firestore :
   seances/{code}            → la séance (cinéma, jour, films, décision, roulette)
   seances/{code}/potes/{uid} → les choix validés de chaque pote (prénom, dispo, films gardés, coup de cœur)
   Avant de valider, les choix d'un invité restent sur son téléphone.
   Chaque téléphone a un identifiant anonyme Firebase : pas de compte à créer.
   ===================================================================== */
const G = { on: false };
const AVC = ['#F28C28', '#2BB3A3', '#F4EFE6', '#E5484D', '#C9A7F5', '#F5D547', '#7CC4F5', '#F59AC0'];
const hm = m => `${Math.floor(m / 60)} h${m % 60 ? ' ' + String(m % 60).padStart(2, '0') : ''}`;
const fromText = m => !m ? 'toute la journée' : m % 30 ? 'dès maintenant' : 'dès ' + hm(m);
const isCreator = () => !!(G.doc && G.doc.creator === G.uid);
const gToday = () => G.doc.jourISO === iso(new Date());
const ended = () => G.doc && G.doc.jourISO < iso(new Date());
const groupLink = () => base() + '?g=' + G.code;
const gKey = () => 'cine:g:' + G.code;
const filmById = id => G.doc.films.find(f => f.id === id);
/* Séances d'un film à partir d'une heure (et pas déjà passées si c'est aujourd'hui) */
const seasFrom = (f, m) => f.s.filter(x => toMin(x.h) >= Math.max(m || 0, gToday() ? nowMin() : 0));
/* Films à départager selon l'heure où on est dispo */
const deckFor = dispo => G.doc.films.map(f => ({ ...f, s: seasFrom(f, dispo) })).filter(f => f.s.length);
const myDispo = () => G.joined ? (G.me.dispo || 0) : 0;
const initial = s => esc(([...String(s || '?').trim()][0] || '?').toUpperCase());

function packFilm(f) {
  return {
    id: String(f.id), t: f.t, d: f.d || 0, g: f.g || '', yt: f.yt || null,
    backdrop: wideImg(f) || null, poster: safeUrl(f.poster) || null, allo: safeUrl(f.allo) || null, sortie: f.sortie || null,
    s: f.s.map(x => ({ h: x.h, v: x.v, ap: !!x.ap, book: safeUrl(x.book) || null }))
  };
}

/* ----- Création : l'organisateur valide ses choix ----- */
async function createGroup(btn) {
  const prenom = String(VAL.prenom || '').trim();
  if (!prenom) { toast('Écris ton prénom'); document.getElementById('v-prenom')?.focus(); return; }
  const list = filmsOfDay().slice(0, 80);   // tous les films du jour : chacun choisit à son heure
  if (!list.length) { toast('Aucune séance à proposer ce jour-là'); return; }
  S.prenom = prenom; store.set('cine:prenom', prenom);
  btn.disabled = true; btn.textContent = 'Création de la séance…';
  try {
    const fb = await getFB();
    let code = makeCode();
    for (let i = 0; i < 3; i++) {
      if (!(await fb.fs.getDoc(fb.fs.doc(fb.db, 'seances', code))).exists()) break;
      code = makeCode();
    }
    const exp = new Date(DAYS[S.day]); exp.setDate(exp.getDate() + 2);
    await fb.fs.setDoc(fb.fs.doc(fb.db, 'seances', code), {
      v: 1, cinema: { id: cin().id, name: cin().name, short: cin().short },
      jour: dayLong(S.day), jourISO: iso(DAYS[S.day]), from: 0,
      creator: fb.uid, auteur: prenom, films: list.map(packFilm),
      createdAt: fb.fs.serverTimestamp(), expireAt: fb.fs.Timestamp.fromDate(exp), decision: null, roulette: null
    });
    // Mes choix déjà faits sur les cartes sont repris
    const L = getList(), ids = new Set(list.map(f => f.id));
    const kept = L.kept.filter(id => ids.has(id)), removed = L.removed.filter(id => ids.has(id));
    await fb.fs.setDoc(fb.fs.doc(fb.db, 'seances', code, 'potes', fb.uid), {
      prenom, dispo: VAL.dispo, kept, removed, coeur: L.coeur && kept.includes(L.coeur) ? L.coeur : null, done: true, at: fb.fs.serverTimestamp()
    });
    S.sheet = null;
    history.pushState(null, '', base() + '?g=' + code);
    await initGroup(code, 'sel');
    window.scrollTo(0, 0);
  } catch (e) {
    console.error(e); toast('Impossible de créer la séance. Vérifie ta connexion.');
    btn.disabled = false; btn.textContent = 'Valider';
  }
}

/* ----- Ouverture d'une séance (lien ?g=CODE) ----- */
async function initGroup(code, tab) {
  Object.assign(G, { on: true, code, step: 'load', tab: 'films', doc: null, potes: {}, me: null, joined: false, sheet: null, playing: null, error: null, hist: [], rouN: 0, showRemoved: false });
  renderGroup();
  try {
    const fb = await getFB(); if (!fb) throw new Error('nofb');
    G.uid = fb.uid;
    const ref = fb.fs.doc(fb.db, 'seances', code);
    const snap = await fb.fs.getDoc(ref);
    if (!snap.exists()) { G.error = 'Cette séance est introuvable. Vérifie le lien reçu.'; G.step = 'err'; return renderGroup(); }
    G.doc = snap.data();
    const mine = await fb.fs.getDoc(fb.fs.doc(fb.db, 'seances', code, 'potes', fb.uid));
    if (mine.exists()) { G.me = mine.data(); G.joined = true; }
    else {
      const loc = store.get(gKey(), null) || {};
      G.me = { prenom: S.prenom, dispo: 0, kept: loc.kept || [], removed: loc.removed || [], coeur: loc.coeur || null, done: false };
    }
    G.rouN = G.doc.roulette ? G.doc.roulette.n : 0;
    G.step = 'ok';
    G.tab = tab || (G.joined || ended() ? 'res' : 'films');
    store.set('cine:lastGroup', { code, jour: G.doc.jourISO });
    fb.fs.onSnapshot(ref, s => { if (s.exists()) { G.doc = s.data(); onGroupChange(); } });
    // On attend les choix des autres avant d'afficher les cartes (ordre et bandeau « gardé par »)
    await new Promise(done => {
      let first = true; const t = setTimeout(done, 3000);
      fb.fs.onSnapshot(fb.fs.collection(fb.db, 'seances', code, 'potes'), s => {
        G.potes = {}; s.docs.forEach(d => { G.potes[d.id] = d.data(); });
        if (first) { first = false; clearTimeout(t); done(); } else onGroupChange();
      }, () => done());
    });
  } catch (e) {
    console.error(e);
    G.error = e.message === 'nofb' ? 'Le mode entre potes n’est pas encore activé sur ce site.' : 'Impossible de charger la séance. Vérifie ta connexion et réessaie.';
    G.step = 'err';
  }
  renderGroup();
}
/* Les potes qui ont validé (moi compris si j'ai validé ; mes choix locaux sont les plus à jour) */
function potesList() {
  const P = { ...G.potes }; delete P[G.uid];
  if (G.me && G.joined) P[G.uid] = G.me;
  return Object.entries(P).map(([uid, p]) => ({ uid, ...p }))
    .sort((a, b) => (b.uid === G.doc.creator) - (a.uid === G.doc.creator) || String(a.prenom).localeCompare(String(b.prenom), 'fr'));
}
function onGroupChange() {
  if (!G.doc || G.step !== 'ok') return;
  const r = G.doc.roulette;
  if (r && r.n !== G.rouN) { G.rouN = r.n; playRoulette(r); }
  const d = document.getElementById('gdec'); if (d) d.innerHTML = gDecHTML();
  if (G.tab === 'res' && !G.sheet && !document.querySelector('.vid')) {
    const b = document.getElementById('gbody'); if (b) b.innerHTML = gResHTML();
  }
}
async function saveMe() {
  const fb = await getFB();

    prenom: G.me.prenom, dispo: G.me.dispo || 0, kept: G.me.kept, removed: G.me.removed,

  });
}
/* Avant validation : sur le téléphone ; après : envoyé aux potes */
function saveMine() {

async function gValidate(btn) {
  const prenom = String(VAL.prenom || '').trim();
  if (!prenom) { toast('Écris ton prénom'); document.getElementById('v-prenom')?.focus(); return; }
  S.prenom = prenom; store.set('cine:prenom', prenom);

  Object.assign(G.me, { prenom, dispo: VAL.dispo || 0, done: true });

/* ----- Affichage ----- */
function gDeck() {
  const M = G.me, seen = new Set([...M.kept, ...M.removed]);
  const others = potesList().filter(p => p.uid !== G.uid);
  const score = f => others.reduce((s, p) => s + ((p.kept || []).includes(f.id) ? 1 : 0) + (p.coeur === f.id ? 1 : 0), 0);
  const all = deckFor(myDispo());
  // Les films déjà gardés par les autres d'abord (les plus demandés en tête)
  const rest = all.filter(f => !seen.has(f.id)).map((f, i) => ({ f, i, s: score(f) }))
    .sort((a, b) => b.s - a.s || a.i - b.i).map(x => x.f);
  return { all, rest };
}
function renderGroup() {
  if (G.step === 'load') { $app.innerHTML = BRAND + `<div class="empty"><h2>Chargement…</h2><p>On récupère la séance entre potes.</p></div>`; return; }
  if (G.step === 'err') { $app.innerHTML = BRAND + `<div class="empty"><h2>Oups</h2><p>${esc(G.error)}</p><a class="big or" href="${base()}">Voir les séances</a></div>`; return; }
  const { all, rest } = gDeck(), tab = G.tab;
  const nav = navHTML(tab, { okFilms: G.joined || (all.length > 0 && !rest.length), okSel: G.joined, cnt: G.me.kept.length, lockRes: !G.joined && !ended() });
  const kick = tab === 'films' ? stepKick(1, 'Je choisis mes films')
    : tab === 'sel' ? stepKick(2, isCreator() ? 'J’invite mes potes' : G.joined ? 'Mes choix sont validés' : 'Je valide mes choix')
    : stepKick(3, 'Les résultats');
  const body = tab === 'films' ? gFilmsHTML(all, rest) : tab === 'sel' ? gSelHTML(rest.length) : gResHTML();
  $app.innerHTML = BRAND + kick + gLine() + `<div id="gdec">${gDecHTML()}</div><div id="gbody" class="gbody">${body}</div>` + CREDIT + nav + gSheetHTML();
  const el = document.querySelector('.card.front');
  if (tab === 'films' && el) {
    attachSwipe(el, {
      up: true, onDecide: gDecide,
      onTap: id => { const f = filmById(id); if (f && f.yt) { G.playing = id; renderGroup(); } else toast('Pas de bande-annonce trouvée pour ce film'); }
    });

}

function gDecide(dir) {
  flyOut(dir, id => {
    const M = G.me, prev = M.coeur || null; _swipes++;
    M.kept = M.kept.filter(x => x !== id); M.removed = M.removed.filter(x => x !== id);

/* Étape 3 : résultats */
function gResults() {
  const P = potesList(), n = P.length;
  const common = Math.max(0, ...P.map(p => p.dispo || 0));   // heure où tout le monde est dispo
  const rows = G.doc.films.map(f => {
    const fans = P.filter(p => (p.kept || []).includes(f.id));
    const coeurs = P.filter(p => p.coeur === f.id);
    return { f, fans, coeurs, seas: seasFrom(f, common), score: fans.length + coeurs.length };
  }).filter(r => r.fans.length)
    .sort((a, b) => (b.seas.length > 0) - (a.seas.length > 0) || b.score - a.score || b.fans.length - a.fans.length || a.f.t.localeCompare(b.f.t, 'fr'));
  const matches = n >= 2 ? rows.filter(r => r.fans.length === n && r.seas.length) : [];
  const rest = rows.filter(r => !matches.includes(r));
  const pool = matches.length ? matches : rows.filter(r => r.seas.length);
  const tied = pool.length ? pool.filter(r => r.score === pool[0].score) : [];
  return { P, n, common, rows, matches, rest, tied };
}

/* D : la roulette (le résultat est partagé : tout le monde voit la même animation) */
async function spinRoulette() {
  const { tied } = gResults(); if (tied.length < 2) return;
  const pick = tied[crypto.getRandomValues(new Uint32Array(1))[0] % tied.length];
  try {
    const fb = await getFB();
    await fb.fs.updateDoc(fb.fs.doc(fb.db, 'seances', G.code), { roulette: { filmId: pick.f.id, pool: tied.map(r => r.f.id), by: G.me ? G.me.prenom : S.prenom, n: Date.now() } });
  } catch (e) { console.error(e); toast('La roulette n’a pas pu être lancée.'); }
}
function playRoulette(r) {
  const titles = (r.pool || []).map(id => (filmById(id) || {}).t).filter(Boolean);
  const win = (filmById(r.filmId) || {}).t; if (!win || titles.length < 2) return;
  document.querySelector('.roul')?.remove();
  const o = document.createElement('div'); o.className = 'roul'; o.setAttribute('role', 'dialog');
  o.innerHTML = `<span class="kick">ROULETTE LANCÉE PAR ${esc(String(r.by || '').toUpperCase())}</span><div class="rt" aria-live="polite"></div>
    <button class="big or" data-act="roulclose" style="visibility:hidden;max-width:320px">Super !</button>`;
  document.body.appendChild(o);
  const rt = o.querySelector('.rt'), seq = [];
  const k = Math.floor(Math.random() * titles.length);
  for (let s = 0; s < 21; s++) seq.push(titles[(k + s) % titles.length]);
  if (seq[seq.length - 1] === win) seq.push(titles.find(t => t !== win));
  seq.push(win);
  let i = 0;
  const tick = () => {
    rt.textContent = seq[i];
    if (i === seq.length - 1) {
      rt.classList.add('win'); o.querySelector('.kick').textContent = 'LA ROULETTE A CHOISI';
      o.querySelector('button').style.visibility = 'visible';
      if (navigator.vibrate) navigator.vibrate(80);
      return;
    }
    i++; setTimeout(tick, 55 + i * i * 0.8);
  };
  tick();
}

/* ---------- Actions ---------- */
function render() {
  if (G.on) return renderGroup();
  if (V.on) return renderShared();
  if (!DATA[S.cin]) { loadCinema(S.cin); return; }
  renderHome();
}
function switchTab(v) {
  if (G.on) {
    if (v === 'res' && !G.joined && !ended()) { toast('Valide d’abord tes choix pour voir les résultats'); v = 'sel'; }
    G.tab = v; G.playing = null; G.sheet = null; renderGroup();
  } else {
    if (v === 'res') { toast('Les résultats s’ouvrent quand tu as validé tes choix et invité tes potes'); v = 'sel'; }
    S.tab = v; S.playing = null; S.sheet = null; render();
  }
  window.scrollTo(0, 0);
}
document.addEventListener('input', e => {
  if (e.target.id === 'f-prenom') S.prenom = e.target.value;
  if (e.target.id === 'f-mot') S.mot = e.target.value;
  if (e.target.id === 'f-prenom' || e.target.id === 'f-mot') { const pv = document.getElementById('f-preview'); if (pv) pv.textContent = buildMsg(payload(), '[lien]'); }
  if (e.target.id === 'v-prenom') VAL.prenom = e.target.value;
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case 'tab': switchTab(v); break;
    case 'sheet': S.sheet = v; render(); break;
    case 'close': if (G.on) G.sheet = null; else S.sheet = null; render(); break;
    /* Réglages : le panneau reste ouvert, la liste se met à jour derrière */
    case 'setcin': S.cin = v; store.set('cine:cin', v); S.playing = null; S.tab = 'films'; render(); break;
    case 'setday': S.day = Number(v); if (S.day !== 0 && S.hour === -1) S.hour = 0; S.playing = null; S.tab = 'films'; render(); break;
    case 'sethour': S.hour = Number(v); S.playing = null; S.tab = 'films'; render(); break;
    case 'nextday': S.day = Math.min(S.day + 1, LIMIT); if (S.hour === -1) S.hour = 0; render(); break;
    case 'allday': S.hour = 0; render(); break;
    case 'decide': decide(v); break;
    case 'undo': undo(); break;
    case 'finish': switchTab('sel'); break;
    case 'stop': if (G.on) G.playing = null; else S.playing = null; render(); break;
    case 'reset': saveList({ kept: [], removed: [], hist: [] }); S.tab = 'films'; render(); break;
    case 'unkeep': { const L = getList(); L.kept = L.kept.filter(x => x !== v); L.removed.push(v); if (L.coeur === v) L.coeur = null; saveList(L); render(); break; }
    case 'rekeep': { const L = getList(); L.removed = L.removed.filter(x => x !== v); L.kept.push(v); saveList(L); render(); break; }
    case 'toggleRemoved': if (G.on) { G.showRemoved = !G.showRemoved; renderGroup(); } else { S.showRemoved = !S.showRemoved; render(); } break;
    case 'share': share(); break;
    case 'video': showVideo(v); break;
    case 'retry': loadCinema(S.cin, true); break;
    case 'closevideo': b.closest('.vid')?.remove(); if (G.on && G.tab === 'res') onGroupChange(); break;
    /* Validation (prénom + heure) */
    case 'valid': VAL.dispo = null; if (G.on) { G.sheet = 'valid'; renderGroup(); } else { S.sheet = 'valid'; render(); } break;
    case 'vdispo': VAL.dispo = Number(v); document.querySelectorAll('[data-act=vdispo]').forEach(c => { const on = c === b; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); }); break;
    case 'validok': if (G.on) gValidate(b); else createGroup(b); break;
    /* Séance entre potes */
    case 'gdecide': gDecide(v); break;
    case 'gundo': gUndo(); break;
    case 'gfinish': switchTab('sel'); break;
    case 'gunkeep': { const M = G.me; M.kept = M.kept.filter(x => x !== v); M.removed.push(v); if (M.coeur === v) M.coeur = null; saveMine(); renderGroup(); break; }
    case 'grekeep': { const M = G.me; M.removed = M.removed.filter(x => x !== v); M.kept.push(v); saveMine(); renderGroup(); break; }
    case 'greset':
      if (!G.me || !confirmReset()) break;
      Object.assign(G.me, { kept: [], removed: [], coeur: null }); G.hist = [];
      saveMine(); G.tab = 'films'; renderGroup(); window.scrollTo(0, 0); break;
    case 'copylink':
      (navigator.clipboard ? navigator.clipboard.writeText(groupLink()) : Promise.reject()).then(() => toast('Lien copié : colle-le où tu veux'), () => toast(groupLink()));
      break;
    case 'gsheet': G.sheet = 'd:' + v; renderGroup(); break;
    case 'gdecideok': gSetDecision(Number(v)); break;
    case 'gundecide': gUndecide(); break;
    case 'groulette': spinRoulette(); break;
    case 'roulclose': b.closest('.roul')?.remove(); onGroupChange(); break;
  }
});
/* Petite confirmation intégrée (pas de fenêtre du navigateur) : il faut toucher 2 fois */
let _resetArmed = 0;
function confirmReset() {
  if (Date.now() - _resetArmed < 4000) { _resetArmed = 0; return true; }
  _resetArmed = Date.now(); toast('Touche encore une fois pour effacer tes choix et recommencer'); return false;
}
document.addEventListener('keydown', e => {
  // Flèches du clavier : ← non merci, → je garde, ↑ coup de cœur
  const arrows = { ArrowLeft: 'nope', ArrowRight: 'keep', ArrowUp: 'coeur' };
  if (arrows[e.key] && !e.target.closest('input,textarea') && document.querySelector('.card.front') && !document.querySelector('.sheet, .vid, .roul')) {
    e.preventDefault();
    if (G.on) { if (G.tab === 'films') gDecide(arrows[e.key]); } else if (S.tab === 'films') decide(arrows[e.key]);
    return;
  }
  if (e.key !== 'Escape') return;
  const vid = document.querySelector('.vid'); if (vid) { vid.remove(); return; }
  const rou = document.querySelector('.roul'); if (rou) { rou.remove(); onGroupChange(); return; }
  if (G.on && G.sheet) { G.sheet = null; renderGroup(); return; }
  if (S.sheet) { S.sheet = null; render(); }
});
window.addEventListener('popstate', () => location.reload());

/* ---------- Démarrage ---------- */
(() => {
  const code = (new URLSearchParams(location.search).get('g') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  if (code) { initGroup(code); return; }
  if (initShared()) return;
  render();
})();
</script>
