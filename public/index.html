<style>
:root{--ink:#1B1B1B;--ink2:#2A2A2A;--cream:#F4EFE6;--sand:#E6DFD2;--or:#F28C28;--teal:#2BB3A3;--red:#E5484D;--muted:#BDBDBD}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
a{color:var(--or)}
.wrap{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:10px 14px calc(100px + env(safe-area-inset-bottom))}
.demo{font-size:11px;text-align:center;color:#8f8f8f;line-height:1.5}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:'Rubik Mono One',sans-serif;font-size:20px;color:var(--cream);letter-spacing:.02em;text-decoration:none}
.logo i{font-style:normal;color:var(--or);margin:0 -.32em}
.tagline{font-size:11px;color:#9a9a9a;text-align:right}
.topbar{display:flex;gap:6px;align-items:stretch}
.tk{flex:1;min-width:0;border:0;border-radius:10px;padding:6px 9px;min-height:50px;text-align:left;color:var(--ink);display:flex;flex-direction:column;justify-content:center}
.tk small{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.tk b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-o{background:var(--or);flex:1.5}.tk-t{background:var(--teal)}.tk-c{background:var(--cream)}
.selbtn{flex:none;width:50px;border:0;border-radius:50%;background:var(--ink2);color:#fff;position:relative;display:flex;align-items:center;justify-content:center}
.count{position:absolute;top:-3px;right:-3px;background:var(--or);color:var(--ink);font-size:11px;font-weight:800;min-width:19px;height:19px;padding:0 4px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.stage{position:relative;display:flex;justify-content:center;min-height:500px}
.card{position:absolute;top:0;width:min(340px,100%);background:var(--cream);color:var(--ink);border-radius:20px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .25s ease}
.card.behind{transform:scale(.94) translateY(16px);filter:brightness(.65);pointer-events:none}
/* La carte du dessus donne sa hauteur à la zone ; celle de dessous est coupée à la même hauteur */
.card.front{position:relative}
.card.behind{bottom:0}
.stage.cards{min-height:0;margin-bottom:14px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--ink);color:var(--cream);font-family:'Rubik Mono One',sans-serif;font-size:11px}
.badge{font-family:Inter,sans-serif;font-size:10px;font-weight:800;letter-spacing:.06em;background:var(--or);color:var(--ink);padding:3px 7px;border-radius:4px}
.media{position:relative;aspect-ratio:16/10;background:#000;cursor:pointer}
.media img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.media{overflow:hidden}
.media .pbg{position:absolute;inset:-24px;background-size:cover;background-position:center;filter:blur(18px) brightness(.55)}
.media img.pfront{position:relative;width:100%;height:100%;object-fit:contain}
.noimg{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;color:#fff;font-family:'Rubik Mono One',sans-serif;font-size:18px;background:#2A2A2A}
a.chip{color:var(--ink);text-decoration:none}
.playbtn{position:absolute;right:12px;bottom:12px;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;pointer-events:none}
.backposter{position:absolute;top:8px;right:8px;z-index:2;border:0;border-radius:999px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;font-weight:700;padding:8px 12px;min-height:36px}
.ctw{height:60px;margin:10px 14px 0;display:flex;align-items:flex-start}
.ctitle{font-family:'Rubik Mono One',sans-serif;font-size:20px;line-height:1.15;width:100%;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px 14px}
.stat{background:var(--sand);border-radius:8px;padding:6px 8px;min-width:0}
.stat small{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;color:#5A544B}
.stat b{display:block;font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.dur{background:var(--ink);color:var(--cream)}.stat.dur small{color:var(--or)}.stat.dur b{font-size:19px;margin-top:0}
.stub{border-top:3px dashed var(--ink);margin-top:6px;padding:10px 14px 14px;display:flex;gap:8px;align-items:flex-start}
.stub .chips{flex:1;min-width:0;height:64px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;overflow:hidden}
.stub .chip{line-height:17px}
.chip[hidden]{display:none!important}
.card.short .stub .chips{height:29px}
.chip.more{background:var(--sand);border:0;font:inherit;font-weight:800;font-size:13px;color:var(--ink);cursor:pointer}
.allseas{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.allseas .chip{font-size:15px;padding:9px 12px}
.fx{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.04em;background:var(--ink);color:var(--cream);border-radius:4px;padding:2px 5px;margin-left:3px;vertical-align:1px;text-transform:uppercase}
.chip{font-size:13px;font-weight:800;background:var(--teal);color:var(--ink);border-radius:6px;padding:6px 9px}
.allo{flex:none;margin-left:auto;font-size:12px;font-weight:700;color:#7C2D12;padding-top:7px;white-space:nowrap}
.stamp{position:absolute;top:96px;z-index:3;font-family:'Rubik Mono One',sans-serif;font-size:24px;padding:6px 14px;border-radius:10px;border:4px solid;opacity:0;pointer-events:none;background:rgba(244,239,230,.92)}
.stamp.keep{left:16px;color:var(--teal);transform:rotate(-14deg)}
.stamp.nope{right:16px;color:var(--red);transform:rotate(14deg)}
.actions{display:flex;justify-content:center;align-items:center;gap:26px}
.rb{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rb.nope{border:2px solid var(--red);background:transparent;color:var(--red)}
.rb.keep{border:0;background:var(--teal);color:var(--ink)}
.rb.undo{width:46px;height:46px;border:1px solid #555;background:transparent;color:#ddd}
.rb:disabled{opacity:.3}
.hint{text-align:center;font-size:12px;color:var(--muted)}
.empty{position:static;text-align:center;padding:40px 10px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-family:'Rubik Mono One',sans-serif;font-size:18px;margin:0}
.empty p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;width:100%;border-radius:999px;border:0;font-weight:800;font-size:16px;text-decoration:none}
.big.or{background:var(--or);color:var(--ink)}.big.ink{background:var(--ink);color:#fff}.big.cream{background:var(--cream);color:var(--ink)}
.big:disabled{opacity:.6}
.ghost{min-height:46px;width:100%;border-radius:999px;border:1px solid #555;background:transparent;color:#fff;font-size:14px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:480px;margin:0 auto;background:var(--cream);color:var(--ink);border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.grip{display:block;width:44px;height:5px;border-radius:3px;background:#BDB6A8;margin:0 auto 10px}
.sheet h2{font-family:'Rubik Mono One',sans-serif;font-size:17px;margin:4px 0 10px}
.sheet .note{font-size:13px;color:#5A544B;line-height:1.45;margin:0 0 8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-radius:12px;background:#fff;color:var(--ink);padding:12px 14px;margin:6px 0;font-weight:600;min-height:52px;text-align:left}
.opt.on{background:var(--ink);color:#fff}
.opt:disabled{opacity:.45;cursor:default}
.opt small{font-weight:500;font-size:12px;opacity:.7}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;margin:10px 0}
.field input{font:inherit;font-weight:400;min-height:46px;border-radius:10px;border:1px solid #BDB6A8;padding:0 12px;background:#fff;color:var(--ink)}
.preview{background:#fff;border:1px solid #E0D9CC;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;white-space:pre-line;word-break:break-word}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:#5A544B;margin-top:12px}
.pagehead{display:flex;align-items:center;gap:10px}
.iconbtn{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:var(--ink2);color:#fff;display:flex;align-items:center;justify-content:center}
.pagehead h1{font-family:'Rubik Mono One',sans-serif;font-size:19px;margin:0}
.pagehead p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:12px}
.mini{background:var(--cream);color:var(--ink);border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.mini .thumb{position:relative;display:block;width:100%;aspect-ratio:16/10;border:0;padding:0;background:#000}
.mini .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.mini .thumb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.mini .rm{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2}
.mini .t{font-family:'Rubik Mono One',sans-serif;font-size:12px;line-height:1.2;padding:8px 10px 2px;min-height:calc(2 * 1.2em + 10px);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .d{padding:0 10px;font-size:18px;font-weight:800}
.mini .s{flex:1;border-top:2px dashed var(--ink);margin-top:6px;padding:6px 10px 8px;font-size:12px;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--ink2);border-radius:12px;padding:8px 10px}
.row img{width:64px;height:40px;object-fit:cover;border-radius:6px}
.row .grow{flex:1;min-width:0;font-weight:600;font-size:14px}
.smallbtn{border:0;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:700;font-size:13px;padding:8px 12px;min-height:40px}
.vid{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.94);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:16px}
.vid iframe{width:100%;max-width:720px;margin:0 auto;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
.vid .vclose{align-self:center;border:0;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:800;padding:12px 22px;min-height:48px}
.vcard{background:var(--cream);color:var(--ink);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.vtop{display:flex;gap:10px;padding:10px}
.vthumb{position:relative;width:120px;flex:none;aspect-ratio:16/10;border:0;padding:0;border-radius:8px;overflow:hidden;background:#000}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vinfo{min-width:0;display:flex;flex-direction:column;gap:3px}
.vinfo .t{font-family:'Rubik Mono One',sans-serif;font-size:14px;line-height:1.15}
.vinfo .m{font-size:12px;color:#5A544B}
.vinfo .d{font-size:20px;font-weight:800}
.vbar{border-top:2px dashed var(--ink);padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vbar .sea{font-size:12px;font-weight:700;flex:1;min-width:0}
.toggle{border:2px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font-weight:800;font-size:13px;padding:8px 14px;min-height:42px;display:flex;align-items:center;gap:6px}
.toggle.on{background:var(--teal);border-color:var(--teal)}
.results{background:var(--ink2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.results h2{font-family:'Rubik Mono One',sans-serif;font-size:15px;margin:0}
.res .l{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.res .bar{height:10px;border-radius:5px;background:#3A3A3A;margin-top:5px;overflow:hidden}
.res .bar span{display:block;height:100%;background:var(--or);border-radius:5px}
.res .n{font-size:12px;color:var(--muted);margin-top:4px}
.dark label.field{color:#fff}
.dark .field input{border-color:#555}
.msg{font-size:14px;line-height:1.5;color:var(--muted);margin:0}
.quote{background:var(--ink2);border-radius:12px;padding:10px 12px;font-style:italic}
.toast{pointer-events:none;position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:50;background:var(--cream);color:var(--ink);font-weight:700;font-size:14px;padding:12px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center}
/* ---------- Séance entre potes ---------- */
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:999px;border:2px solid var(--or);background:transparent;color:var(--or);font-weight:800;font-size:15px;text-decoration:none}
.recap{background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;line-height:1.45}
.how{margin:12px 0;padding-left:20px;font-size:13px;color:#5A544B;line-height:1.5}
.how li{margin:3px 0}
.linkbtn{border:0;background:transparent;color:var(--or);font-weight:700;font-size:13px;padding:8px 4px;min-height:40px;text-decoration:underline}
.kick{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--or)}
.ghead{background:var(--ink2);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ghead .gt{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ghead h1{font-family:'Rubik Mono One',sans-serif;font-size:15px;line-height:1.25;margin:2px 0 0}
.ghead p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.invite{flex:none;display:flex;align-items:center;gap:6px;background:var(--teal);color:var(--ink);font-weight:800;font-size:13px;border-radius:999px;padding:8px 12px;min-height:42px;text-decoration:none}
.potes{display:flex;flex-wrap:wrap;gap:6px}
.pote{display:flex;align-items:center;gap:6px;background:#1F1F1F;border-radius:999px;padding:3px 10px 3px 3px;font-size:12px;font-weight:700}
.pote small{font-weight:600;color:var(--muted)}
.pote.done small{color:var(--teal)}
.av{width:26px;height:26px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--ink)}
.gbody{display:flex;flex-direction:column;gap:12px}
.gprog{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.stamp.coeur{left:50%;top:70px;color:var(--or);transform:translateX(-50%) rotate(-4deg);white-space:nowrap;font-size:20px}
.actions.g4{gap:16px}
.rb.coeur{width:56px;height:56px;border:0;background:var(--or);color:var(--ink)}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{border:2px solid #555;border-radius:999px;background:transparent;color:#fff;font-weight:700;font-size:14px;padding:8px 14px;min-height:44px}
.dchip.on{background:var(--or);border-color:var(--or);color:var(--ink)}
.lbl2{font-size:13px;font-weight:700;margin-top:4px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h2{font-family:'Rubik Mono One',sans-serif;font-size:15px;margin:8px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-family:Inter,sans-serif;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:4px;background:var(--teal);color:var(--ink)}
.tag.or{background:var(--or)}
.vcard.match{box-shadow:0 0 0 3px var(--teal)}
.vcard.chosen{box-shadow:0 0 0 3px var(--or)}
.vinfo .who{font-size:12px;color:#5A544B;line-height:1.35}
.vinfo .sc{font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.decide{border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;min-height:42px}
.decban{background:var(--teal);color:var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.decban .kick{color:var(--ink)}
.decban h2{font-family:'Rubik Mono One',sans-serif;font-size:19px;line-height:1.15;margin:0}
.decban p{margin:0;font-size:14px;font-weight:600}
.decban .linkbtn{color:var(--ink);align-self:center}
.pcard{background:var(--ink2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pcard .ph{display:flex;align-items:center;gap:8px;font-weight:800;flex-wrap:wrap}
.pcard .ph small{font-weight:600;color:var(--muted);font-size:12px}
.pcard .pl{font-size:13px;color:#ddd;line-height:1.5}
.pcard .pl b{color:var(--or)}
.roul{position:fixed;inset:0;z-index:45;background:rgba(27,27,27,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.roul .rt{font-family:'Rubik Mono One',sans-serif;font-size:24px;line-height:1.2;color:var(--cream);min-height:3.6em;display:flex;align-items:center;justify-content:center;max-width:420px}
.roul .rt.win{color:var(--or);animation:pop .45s ease}
.under{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:-4px}
.linkbtn.soft{color:#bbb;text-decoration:none;display:flex;align-items:center;gap:6px}
.linkbtn:disabled{opacity:.3}
.hint .or{color:var(--or);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.others{margin:4px 14px 0;height:28px;background:#DDF3EF;color:#0F4F47;font-size:12px;font-weight:700;border-radius:8px;padding:0 9px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
.others svg{flex:none}.others span{min-width:0;overflow:hidden;text-overflow:ellipsis}.others .oc{flex:none;max-width:40%}
.others.none{background:var(--sand);color:#6b6459;font-weight:600}
.mheart{font-size:11px;font-weight:700;color:var(--or);white-space:nowrap}

const FB_VERSION = '10.12.2';

/* ---------- Cinémas ----------
   Toute la France : recherche (ville, code postal, nom) et « Près de moi » via /api/cinemas.
   Les cinémas déjà choisis sont gardés sur le téléphone (« Mes cinémas »).
   Anciens cinémas de départ, repris pour ceux qui les utilisaient déjà : */
const OLD_CINEMAS = [
  { id: 'W9161', name: 'CinéToile', city: 'Ballancourt' },
  { id: 'B0053', name: 'Cinéma Arcel', city: 'Corbeil-Essonnes' },

];
const CIN_API = '/api/cinemas';

  const sc = (document.querySelector('.sheet') || {}).scrollTop || 0, foc = document.activeElement && document.activeElement.classList.contains('sdial');
  fn();

  if (foc) document.querySelector('.sdial')?.focus();
}
function dialPick(el, m) {   // pendant le glissement
  el.dataset.label = '';

  const act = el.dataset.for === 'set' ? 'sethour' : 'vdispo';
  document.querySelectorAll(`[data-act=${act}]`).forEach(c => { c.classList.remove('on'); c.setAttribute('aria-pressed', 'false'); });
  if (el.dataset.for === 'valid') VAL.dispo = m;
}
function dialCommit(el, m) { // quand on lâche
  if (el.dataset.for === 'set') { S.hour = m; S.playing = null; S.tab = 'films'; keepSheet(render); }
  else VAL.dispo = m;
}
function dialValueAt(el, cx, cy) {
  const r = el.querySelector('svg').getBoundingClientRect();
  const X = ((cx - r.left) * DW / r.width - DCX) / DRX, Y = (DBY - (cy - r.top) * DH / r.height) / DRY;
  const a = Math.atan2(Math.max(Y, 0.0001), X), u = 1 - a / Math.PI;
  const m = DIAL_MIN + Math.round(u * (DIAL_MAX - DIAL_MIN) / DIAL_STEP) * DIAL_STEP;
  return Math.max(+el.dataset.floor, Math.min(DIAL_MAX, m));
}

  _dial.last = m; dialPick(_dial.el, m);
}

/* ---------- Chargement des séances (fonction serveur) ---------- */
const DATA = {};   // id du cinéma -> { status: 'loading' | 'ok' | 'error', films, error }
async function loadCinema(id, force) {
  if (!force && DATA[id] && DATA[id].status !== 'error') return;
  DATA[id] = { status: 'loading' };
  if (S.cin === id && !G.on) render();
  try {
    const r = await fetch(`${API}?cinema=${encodeURIComponent(id)}`);
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.error) throw new Error(j.error || 'Erreur ' + r.status);
    DATA[id] = { status: 'ok', films: j.films || [], stale: !!j.stale };
    if (j.pending) completeTrailers(id, 0);
  } catch (e) {
    DATA[id] = { status: 'error', error: e.message };
  }
  if (S.cin !== id || G.on) return;
  // Plus aucune séance aujourd'hui (ex. tard le soir) : on passe à demain, une seule fois
  if (!S.autoDone && S.day === 0 && S.hour === -1 && DATA[id].status === 'ok' && !filmsFor().length && DATA[id].films.length) {
    S.autoDone = true; S.day = 1; S.hour = 0; render(); toast('Plus de séance aujourd’hui : voici demain'); return;
  }
  S.autoDone = true;
  render();
}
/* Les bandes-annonces sont cherchées par petits paquets côté serveur :
   tant qu'il en manque, on redemande (6 fois au plus) et on met les cartes à jour. */
async function completeTrailers(id, n) {
  if (n >= 6) return;
  await new Promise(r => setTimeout(r, 700));
  try {
    const j = await fetch(`${API}?cinema=${encodeURIComponent(id)}`).then(r => r.json());
    if (j && Array.isArray(j.films) && DATA[id] && DATA[id].status === 'ok') {
      DATA[id].films = j.films;
      if (S.cin === id && !G.on && !S.playing && !S.sheet && !document.querySelector('.vid')) render();
      if (j.pending) completeTrailers(id, n + 1);
    }
  } catch (e) {}
}
function filmsFor() {
  const D = DATA[S.cin]; if (!D || D.status !== 'ok') return [];
  const di = iso(DAYS[S.day]); const m = hourMin();
  return D.films.map(f => ({ ...f, s: f.s.filter(x => x.d === di && toMin(x.h) >= m) })).filter(f => f.s.length);
}
function filmsOfDay() {
  const D = DATA[S.cin]; if (!D || D.status !== 'ok') return [];
  const di = iso(DAYS[S.day]), m = S.day === 0 ? nowMin() : 0;
  return D.films.map(f => ({ ...f, s: f.s.filter(x => x.d === di && toMin(x.h) >= m) })).filter(f => f.s.length);
}
function isNew(f, day = DAYS[S.day]) {
  const sd = String(f.sortie || '').slice(0, 10); if (!/^\d{4}-\d{2}-\d{2}$/.test(sd)) return false;
  const diff = (day - new Date(sd + 'T00:00:00')) / 86400000;
  return diff >= 0 && diff < 7;
}

/* Toutes les cartes ont la même taille : le titre tient sur 2 lignes (on réduit la police si besoin)
   et les horaires sur 2 rangées (les suivants sont regroupés dans « +N », qui ouvre AlloCiné) */
function fitChips(card) {
  const box = card.querySelector('.stub .chips'); if (!box) return;
  const chips = [...box.querySelectorAll('.chip:not(.more)')], more = box.querySelector('.more');
  chips.forEach(c => { c.hidden = false; }); more.hidden = true;
  if (box.scrollHeight <= box.clientHeight + 1) return;
  more.hidden = false;
  let n = 0;
  while (box.scrollHeight > box.clientHeight + 1 && n < chips.length) { n++; chips[chips.length - n].hidden = true; more.textContent = '+' + n; more.setAttribute('aria-label', `Voir toutes les séances (${n} de plus)`); }
}
/* Les horaires ont 2 rangées seulement si au moins un film du jour en a besoin (sinon 1 rangée pour toutes les cartes) */
let _deckAll = [], _rowsKey = '', _twoRows = true;

  const key = width + '|' + _deckAll.map(f => f.id + ':' + f.s.length).join(',');

  st.style.cssText = `position:absolute;left:-9999px;top:0;visibility:hidden;border:0;padding:0;margin:0;width:${width}px`;
  st.innerHTML = '<div class="chips" style="height:auto;flex:none;width:100%"></div>';
  document.body.appendChild(st);
  const box = st.firstChild; let two = false;
  for (const f of _deckAll) {
    box.innerHTML = f.s.map(x => `<span class="chip">${chipIn(x)}</span>`).join('');

function fitCards() {

  document.querySelectorAll('.card').forEach(card => {
    card.classList.toggle('short', oneRow);

      while (t.scrollHeight > t.clientHeight + 1 && size > 13) {

/* Petit écran (barre d'adresse du navigateur…) : on réduit un peu la photo pour que la carte,
   « Annuler » et « J'ai fini » tiennent au-dessus des onglets du bas, sans avoir à faire défiler.
   Sur les très petits écrans, les horaires passent aussi sur une seule rangée (+N pour les autres). */
function fitStage() {
  const front = document.querySelector('.card.front'); if (!front) return;
  const cards = [...document.querySelectorAll('.card')], medias = cards.map(c => c.querySelector('.media')).filter(Boolean);
  medias.forEach(m => { m.style.height = ''; m.style.aspectRatio = ''; });
  const fm = front.querySelector('.media'); if (!fm) return;
  const nav = document.querySelector('.nav'), under = document.querySelector('.under');
  const room = () => window.innerHeight - (nav ? nav.offsetHeight : 0) - (front.getBoundingClientRect().top + window.scrollY) - (under ? under.offsetHeight + 16 : 0) - 12;
  let extra = front.offsetHeight - room();

    if (e.target.closest('a,button,iframe')) return;
    down = true; dx = dy = 0; x0 = e.clientX; y0 = e.clientY;
    onMedia = !!e.target.closest('.media'); el.classList.remove('nudge');
    el.style.transition = 'none';
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
  });
  el.addEventListener('pointermove', e => {
    if (!down) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    el.style.transform = `translate(${dx}px, ${opt.up ? Math.min(dy, 40) : dy * 0.15}px) rotate(${dx / 18}deg)`;
    const up = upward();
    keep.style.opacity = up ? 0 : Math.max(0, Math.min(1, dx / 110));
    nope.style.opacity = up ? 0 : Math.max(0, Math.min(1, -dx / 110));
    if (coeur) coeur.style.opacity = up ? Math.max(0, Math.min(1, -dy / 110)) : 0;
  });
  const end = () => {
    if (!down) return; down = false;
    el.style.transition = '';
    if (upward() && dy < -110) return opt.onDecide('coeur');
    if (dx > 110) return opt.onDecide('keep');
    if (dx < -110) return opt.onDecide('nope');
    reset();
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && onMedia) opt.onTap(el.dataset.id);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', () => { down = false; reset(); });
}
/* Fait partir la carte du dessus, puis appelle cb(id du film) */
function flyOut(dir, cb) {
  const el = document.querySelector('.card.front'); if (!el || el.dataset.flying) return;
  el.dataset.flying = '1';

    : `translate(${dir === 'keep' ? 640 : -640}px, 40px) rotate(${dir === 'keep' ? 24 : -24}deg)`;
  const st = el.querySelector('.stamp.' + dir); if (st) st.style.opacity = 1;
  setTimeout(() => cb(id), 280);
}

/* =====================================================================
   CHOIX DU CINÉMA (toute la France)
   - recherche : ville, code postal ou nom du cinéma (AlloCiné + villes de la Géoplateforme IGN)
   - « Près de moi » : position du téléphone → cinémas des départements autour, triés par distance

const GEO = 'https://data.geopf.fr/geocodage';
const kmBetween = (a, b, c, d) => { const R = 6371, t = Math.PI / 180, x = (d - b) * t * Math.cos((a + c) / 2 * t), y = (c - a) * t; return Math.sqrt(x * x + y * y) * R; };
const fmtKm = k => k < 10 ? k.toFixed(1).replace('.', ',') + ' km' : Math.round(k) + ' km';
let _pickT = null, _pickN = 0;
const favHint = () => `<p class="pnote">${ICON.star} Touche l’étoile à côté d’un cinéma pour le garder dans tes favoris (${MAX_FAVS} maximum).</p>`;
/* Ce qu'on voit avant de chercher : mes favoris (et le cinéma en cours s'il n'en fait pas partie) */
function pickDefault() {
  const F = favs(), cur = curCinema();
  let h = '';
  if (cur && !F.some(c => c.id === cur.id)) h += `<div class="lbl">EN CE MOMENT</div>` + cinRow(cur);
  if (F.length) h += `<div class="lbl">MES FAVORIS</div>` + F.map(c => cinRow(c)).join('');
  return h + (F.length < MAX_FAVS ? favHint() : '');
}
function pickerHTML() {
  return `<label class="srch">${ICON.search}<input id="c-q" type="search" inputmode="search" autocomplete="off" placeholder="Ville, code postal ou cinéma" aria-label="Chercher un cinéma"></label>
    <button class="nearbtn" data-act="near">${ICON.target} Les cinémas près de moi</button>
    <div id="c-res" aria-live="polite">${pickDefault()}</div>`;
}
function cinRow(c, km) {
  const meta = [c.city, km != null ? fmtKm(km) : '', c.screens ? c.screens + ' salle' + (c.screens > 1 ? 's' : '') : ''].filter(Boolean).join(' · ');
  return `<div class="crw"><button class="crow${c.id === S.cin ? ' on' : ''}" data-act="pickcin" data-v="${esc(c.id)}" data-n="${esc(c.name)}" data-c="${esc(c.city || '')}">
    <b>${esc(c.name)}</b>${meta ? `<span>${esc(meta)}</span>` : ''}</button>${starBtn(c)}</div>`;
}
const pickRes = html => { const el = document.getElementById('c-res'); if (el) el.innerHTML = html; };
const pickWait = txt => pickRes(`<p class="pnote"><span class="spin"></span>${esc(txt)}</p>`);
/* Recherche pendant la frappe */
function pickInput(q) {
  clearTimeout(_pickT);
  q = q.trim();
  if (q.length < 2) { pickRes(pickDefault()); return; }
  _pickT = setTimeout(() => pickSearch(q), 350);
}
async function pickSearch(q) {
  const n = ++_pickN;
  pickWait('Recherche…');
  const [allo, towns] = await Promise.all([
    fetch(`${CIN_API}?q=${encodeURIComponent(q)}`).then(r => r.json()).catch(() => ({})),
    fetch(`${GEO}/search?q=${encodeURIComponent(q)}&index=address&type=municipality&limit=5&autocomplete=1`).then(r => r.json()).catch(() => ({}))
  ]);

  const th = (allo && allo.theaters) || [];

  let h = '';

    return `<button class="crow town" data-act="neartown" data-lat="${lat}" data-lon="${lon}" data-label="${esc(label)}"><b>${ICON.pin} ${esc(label)}</b><span>Voir les cinémas autour</span></button>`;
  }).join('');

/* Cinémas autour d'un point */
async function nearPlace(lat, lon, label) {
  const n = ++_pickN;
  pickWait(`Recherche des cinémas autour de ${label || 'toi'}…`);
  const deps = Object.entries(DEPC).map(([d, [la, lo, r]]) => ({ d, gap: kmBetween(lat, lon, la, lo) - r }))
    .filter(x => x.gap < 30).sort((a, b) => a.gap - b.gap).slice(0, 5).map(x => x.d);
  if (!deps.length) { pickRes(`<p class="pnote">Aucun cinéma trouvé par ici. Essaie avec le nom d’une ville.</p>`); return; }
  const lists = await Promise.all(deps.map(d => fetch(`${CIN_API}?dep=${d}`).then(r => r.json()).catch(() => ({}))));
  if (n !== _pickN) return;
  const seen = new Set(), all = [];
  for (const l of lists) for (const c of (l.cinemas || [])) if (!seen.has(c.id) && c.lat != null) { seen.add(c.id); all.push({ ...c, km: kmBetween(lat, lon, c.lat, c.lon) }); }
  all.sort((a, b) => a.km - b.km);
  const near = all.filter(c => c.km <= 40).slice(0, 15);
  const shown = near.length ? near : all.slice(0, 8);
  if (!shown.length) { pickRes(`<p class="pnote">Impossible de charger les cinémas pour le moment. Réessaie dans un instant.</p>`); return; }
  pickRes(`<div class="lbl">AUTOUR DE ${esc((label || 'toi').toUpperCase())}</div>` + shown.map(c => cinRow(c, c.km)).join(''));
}
function nearMe() {
  if (!navigator.geolocation) { pickRes(`<p class="pnote">Ton téléphone ne donne pas sa position. Tape plutôt le nom de ta ville.</p>`); return; }
  pickWait('On cherche où tu es…');
  navigator.geolocation.getCurrentPosition(
    p => nearPlace(p.coords.latitude, p.coords.longitude, 'toi'),
    e => pickRes(`<p class="pnote">${e.code === 1 ? 'Tu n’as pas autorisé la localisation.' : 'Position introuvable pour le moment.'} Tape plutôt le nom de ta ville.</p>`),
    { enableHighAccuracy: false, timeout: 12000, maximumAge: 10 * 60000 }
  );
}
async function cityList(id, label) {

function makeCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = ''; const r = crypto.getRandomValues(new Uint8Array(6)); for (const x of r) c += A[x % A.length]; return c; }

/* ---------- Firebase (chargé seulement s'il est configuré) ---------- */
let _fb = null;
async function getFB() {
  if (!FIREBASE_CONFIG) return null;
  if (_fb) return _fb;
  const u = n => `https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-${n}.js`;
  const [app, auth, fs] = await Promise.all([import(u('app')), import(u('auth')), import(u('firestore'))]);
  const a = app.initializeApp(FIREBASE_CONFIG);
  const au = auth.getAuth(a);
  await auth.signInAnonymously(au);
  _fb = { db: fs.getFirestore(a), uid: au.currentUser.uid, fs };
  return _fb;
}

/* =====================================================================
   SÉANCE ENTRE POTES
   Firestore :
   seances/{code}            → la séance (cinéma, jour, films, décision, roulette)
   seances/{code}/potes/{uid} → les choix validés de chaque pote (prénom, dispo, films gardés, coup de cœur)
   Avant de valider, les choix d'un invité restent sur son téléphone.
   Chaque téléphone a un identifiant anonyme Firebase : pas de compte à créer.
   ===================================================================== */
const G = { on: false };
const AVC = ['#F28C28', '#2BB3A3', '#F4EFE6', '#E5484D', '#C9A7F5', '#F5D547', '#7CC4F5', '#F59AC0'];
const hm = m => `${Math.floor(m / 60)} h${m % 60 ? ' ' + String(m % 60).padStart(2, '0') : ''}`;
const fromText = m => !m ? 'toute la journée' : m % 15 ? 'dès maintenant' : 'dès ' + hm(m);
const isCreator = () => !!(G.doc && G.doc.creator === G.uid);
const gToday = () => G.doc.jourISO === iso(new Date());
/* Heure de fin : film choisi terminé (+ 30 min de marge), sinon minuit le jour de la séance */
function endTime() {
  const D = G.doc, day = new Date(D.jourISO + 'T00:00:00').getTime(), dc = D.decision;
  if (dc) { const f = filmById(dc.filmId); return day + (toMin(dc.h) + ((f && f.d) || 120) + 30) * 60000; }
  return day + 24 * 3600000;
}
const ended = () => !!(G.doc && Date.now() > endTime());
const isCancelled = () => !!(G.doc && G.doc.annulee);
function rememberGroup() {
  store.set('cine:lastGroup', { code: G.code, jour: G.doc.jourISO, cin: G.doc.cinema.id, fin: G.doc.decision ? endTime() : null });
}
const groupLink = () => base() + '?g=' + G.code;
const gKey = () => 'cine:g:' + G.code;
const filmById = id => G.doc.films.find(f => f.id === id);
/* Séances d'un film à partir d'une heure (et pas déjà passées si c'est aujourd'hui) */
const seasFrom = (f, m) => f.s.filter(x => toMin(x.h) >= Math.max(m || 0, gToday() ? nowMin() : 0));
/* Films à départager selon l'heure où on est dispo */
const deckFor = dispo => G.doc.films.map(f => ({ ...f, s: seasFrom(f, dispo) })).filter(f => f.s.length);
const myDispo = () => G.joined ? (G.me.dispo || 0) : 0;
const initial = s => esc(([...String(s || '?').trim()][0] || '?').toUpperCase());

function packFilm(f) {
  return {
    id: String(f.id), t: f.t, d: f.d || 0, g: f.g || '', yt: f.yt || null,
    backdrop: wideImg(f) || null, poster: safeUrl(f.poster) || null, allo: safeUrl(f.allo) || null, sortie: f.sortie || null,
    s: f.s.map(x => ({ h: x.h, v: x.v, ...(x.fx ? { fx: String(x.fx).slice(0, 30) } : {}), ap: !!x.ap, book: safeUrl(x.book) || null }))
  };
}

/* ----- Création : l'organisateur valide ses choix ----- */
async function createGroup(btn) {
  const prenom = String(VAL.prenom || '').trim();
  if (!prenom) { toast('Écris ton prénom'); document.getElementById('v-prenom')?.focus(); return; }
  const list = filmsOfDay().slice(0, 80);   // tous les films du jour : chacun choisit à son heure
  if (!list.length) { toast('Aucune séance à proposer ce jour-là'); return; }
  S.prenom = prenom; store.set('cine:prenom', prenom);
  btn.disabled = true; btn.textContent = 'Création de la séance…';
  try {
    const fb = await getFB();
    let code = makeCode();
    for (let i = 0; i < 3; i++) {
      if (!(await fb.fs.getDoc(fb.fs.doc(fb.db, 'seances', code))).exists()) break;
      code = makeCode();
    }
    const exp = new Date(DAYS[S.day]); exp.setDate(exp.getDate() + 2);
    await fb.fs.setDoc(fb.fs.doc(fb.db, 'seances', code), {
      v: 1, cinema: { id: cin().id, name: cin().name, short: cin().short },
      jour: dayLong(S.day), jourISO: iso(DAYS[S.day]), from: 0,
      creator: fb.uid, auteur: prenom, films: list.map(packFilm),
      createdAt: fb.fs.serverTimestamp(), expireAt: fb.fs.Timestamp.fromDate(exp), decision: null, roulette: null
    });
    // Mes choix déjà faits sur les cartes sont repris
    const L = getList(), ids = new Set(list.map(f => f.id));
    const kept = L.kept.filter(id => ids.has(id)), removed = L.removed.filter(id => ids.has(id));
    await fb.fs.setDoc(fb.fs.doc(fb.db, 'seances', code, 'potes', fb.uid), {
      prenom, dispo: VAL.dispo, kept, removed, coeur: L.coeur && kept.includes(L.coeur) ? L.coeur : null, done: true, at: fb.fs.serverTimestamp()
    });
    S.sheet = null;
    history.pushState(null, '', base() + '?g=' + code);
    await initGroup(code, 'sel');
    window.scrollTo(0, 0);
  } catch (e) {
    console.error(e); toast('Impossible de créer la séance. Vérifie ta connexion.');
    btn.disabled = false; btn.textContent = 'Valider';
  }
}

/* ----- Ouverture d'une séance (lien ?g=CODE) ----- */
async function initGroup(code, tab) {
  Object.assign(G, { on: true, code, step: 'load', tab: 'films', doc: null, potes: {}, me: null, joined: false, sheet: null, playing: null, error: null, hist: [], rouN: 0, showRemoved: false });
  renderGroup();
  try {
    const fb = await getFB(); if (!fb) throw new Error('nofb');
    G.uid = fb.uid;
    const ref = fb.fs.doc(fb.db, 'seances', code);
    const snap = await fb.fs.getDoc(ref);
    if (!snap.exists()) { G.error = 'Cette séance est introuvable. Vérifie le lien reçu.'; G.step = 'err'; return renderGroup(); }
    G.doc = snap.data();
    const mine = await fb.fs.getDoc(fb.fs.doc(fb.db, 'seances', code, 'potes', fb.uid));
    if (mine.exists()) { G.me = mine.data(); G.joined = true; }
    else {
      const loc = store.get(gKey(), null) || {};
      G.me = { prenom: S.prenom, dispo: 0, kept: loc.kept || [], removed: loc.removed || [], coeur: loc.coeur || null, done: false };
    }
    G.rouN = G.doc.roulette ? G.doc.roulette.n : 0;
    G.step = 'ok';
    G.tab = tab || (G.joined || ended() ? 'res' : 'films');
    if (!isCancelled() && !ended()) rememberGroup();
    fb.fs.onSnapshot(ref, s => { if (s.exists()) { G.doc = s.data(); onGroupChange(); } });
    // On attend les choix des autres avant d'afficher les cartes (ordre et bandeau « gardé par »)
    await new Promise(done => {
      let first = true; const t = setTimeout(done, 3000);
      fb.fs.onSnapshot(fb.fs.collection(fb.db, 'seances', code, 'potes'), s => {
        G.potes = {}; s.docs.forEach(d => { G.potes[d.id] = d.data(); });
        if (first) { first = false; clearTimeout(t); done(); } else onGroupChange();
      }, () => done());
    });
  } catch (e) {
    console.error(e);
    G.error = e.message === 'nofb' ? 'Le mode entre potes n’est pas encore activé sur ce site.' : 'Impossible de charger la séance. Vérifie ta connexion et réessaie.';
    G.step = 'err';
  }
  renderGroup();
}
/* Les potes qui ont validé (moi compris si j'ai validé ; mes choix locaux sont les plus à jour) */
function potesList() {
  const P = { ...G.potes }; delete P[G.uid];
  if (G.me && G.joined) P[G.uid] = G.me;
  return Object.entries(P).map(([uid, p]) => ({ uid, ...p }))
    .sort((a, b) => (b.uid === G.doc.creator) - (a.uid === G.doc.creator) || String(a.prenom).localeCompare(String(b.prenom), 'fr'));
}
function onGroupChange() {
  if (!G.doc || G.step !== 'ok') return;
  if (isCancelled() || ended()) { if (!G.over) renderGroup(); return; }
  const lg = store.get('cine:lastGroup', null); if (lg && lg.code === G.code) rememberGroup();
  const r = G.doc.roulette;
  if (r && r.n !== G.rouN) { G.rouN = r.n; playRoulette(r); }
  const d = document.getElementById('gdec'); if (d) d.innerHTML = gDecHTML();
  if (G.tab === 'res' && !G.sheet && !document.querySelector('.vid')) {
    const b = document.getElementById('gbody'); if (b) b.innerHTML = gResHTML();
  }
}
async function saveMe() {
  const fb = await getFB();
  await fb.fs.setDoc(fb.fs.doc(fb.db, 'seances', G.code, 'potes', fb.uid), {
    prenom: G.me.prenom, dispo: G.me.dispo || 0, kept: G.me.kept, removed: G.me.removed,
    coeur: G.me.coeur || null, done: true, at: fb.fs.serverTimestamp()
  });
}
/* Avant validation : sur le téléphone ; après : envoyé aux potes */
function saveMine() {
  if (G.joined) return saveMe().catch(e => { console.error(e); toast('Connexion perdue : ton choix sera renvoyé au prochain film'); });
  store.set(gKey(), { kept: G.me.kept, removed: G.me.removed, coeur: G.me.coeur, jour: G.doc.jourISO });
}
async function gValidate(btn) {
  const prenom = String(VAL.prenom || '').trim();
  if (!prenom) { toast('Écris ton prénom'); document.getElementById('v-prenom')?.focus(); return; }
  S.prenom = prenom; store.set('cine:prenom', prenom);
  const before = { ...G.me };
  Object.assign(G.me, { prenom, dispo: VAL.dispo || 0, done: true });
  btn.disabled = true; btn.textContent = 'Envoi…';
  try { await saveMe(); }
  catch (e) { console.error(e); G.me = before; toast('Tes choix n’ont pas pu être envoyés. Réessaie.'); btn.disabled = false; btn.textContent = 'Valider et voir les résultats'; return; }
  G.joined = true; G.sheet = null; G.tab = 'res'; store.set(gKey(), null);
  renderGroup(); window.scrollTo(0, 0);
  toast('Choix validés ! Voici les résultats');
}

/* ----- Affichage ----- */
function gDeck() {
  const M = G.me, seen = new Set([...M.kept, ...M.removed]);
  const others = potesList().filter(p => p.uid !== G.uid);
  const score = f => others.reduce((s, p) => s + ((p.kept || []).includes(f.id) ? 1 : 0) + (p.coeur === f.id ? 1 : 0), 0);
  const all = deckFor(myDispo());
  // Les films déjà gardés par les autres d'abord (les plus demandés en tête)
  const rest = all.filter(f => !seen.has(f.id)).map((f, i) => ({ f, i, s: score(f) }))
    .sort((a, b) => b.s - a.s || a.i - b.i).map(x => x.f);
  return { all, rest };
}
function renderGroup() {
  if (G.step === 'load') { $app.innerHTML = BRAND + `<div class="empty"><h2>Chargement…</h2><p>On récupère la séance entre potes.</p></div>`; return; }
  if (G.step === 'err') { $app.innerHTML = BRAND + `<div class="empty"><h2>Oups</h2><p>${esc(G.error)}</p><a class="big or" href="${base()}">Voir les séances</a></div>`; return; }
  if (isCancelled() || ended()) return renderOver();
  const { all, rest } = gDeck(), tab = G.tab;
  const nav = navHTML(tab, { okFilms: G.joined || (all.length > 0 && !rest.length), okSel: G.joined, cnt: G.me.kept.length, lockRes: !G.joined && !ended() });
  const kick = tab === 'films' ? stepKick(1, 'Je choisis mes films')
    : tab === 'sel' ? stepKick(2, isCreator() ? 'J’invite mes potes' : G.joined ? (isAbsent(G.me) ? 'Pas dispo cette fois' : 'Mes choix sont validés') : 'Je valide mes choix')
    : stepKick(3, 'Les résultats');
  const meAbs = G.joined && isAbsent(G.me);
  const body = meAbs && tab !== 'res' ? absentCardHTML() : tab === 'films' ? gFilmsHTML(all, rest) : tab === 'sel' ? gSelHTML(rest.length) : gResHTML();
  // Sur l'écran des résultats, le choix final est affiché en grand (billet) : pas de bandeau en double
  $app.innerHTML = BRAND + kick + gLine() + (tab === 'res' ? '' : `<div id="gdec">${gDecHTML()}</div>`) + `<div id="gbody" class="gbody">${body}</div>` + CREDIT + nav + gSheetHTML();
  fitCards();
  const el = document.querySelector('.card.front');
  if (tab === 'films' && el) {
    attachSwipe(el, {
      up: true, onDecide: gDecide,
      onTap: id => { const f = filmById(id); if (f && f.yt) { G.playing = id; renderGroup(); } }
    });
    armNudge();
  }
}
function gLine() {
  const D = G.doc;
  return `<div class="gline">${ICON.group}<span>${isCreator() ? 'Ta séance' : `Séance lancée par <b>${esc(D.auteur)}</b>`} · ${esc(D.cinema.short)} · ${esc(D.jour)}</span></div>`;
}
function othersHTML(f) {
  const fans = potesList().filter(p => p.uid !== G.uid && (p.kept || []).includes(f.id));
  if (!fans.length) return `<div class="others none"><span>Pas encore gardé par tes potes</span></div>`;
  const c = fans.filter(p => p.coeur === f.id).map(p => esc(p.prenom));
  return `<div class="others">${ICON.oks}<span>Gardé par ${fans.map(p => esc(p.prenom)).join(', ')}</span>${c.length ? `<span class="oc">${ICON.hs} ${c.join(', ')}</span>` : ''}</div>`;
}
/* Étape 1 : les cartes */
function gFilmsHTML(all, rest) {
  const M = G.me, D = G.doc;
  let h = '';
  if (!G.joined && !isCreator() && !M.kept.length && !M.removed.length) {
    h += `<div class="tip"><b>${esc(D.auteur)} lance une séance ciné : à vous de choisir le film !</b> Garde les films qui te tentent, élimine les autres. Sur chaque carte, tu vois qui l’a déjà gardé. Quand tu as fini, valide tes choix pour voir les résultats.
      <button class="nodispo" data-act="gabsent">Pas dispo ce jour-là ? Préviens tes potes</button></div>`;
  }
  if (!rest.length) {
    return h + `<div class="empty"><h2>Tous vus !</h2><p>Tu as passé les ${all.length} films et tu en as gardé ${M.kept.length}.</p>
      <button class="big or" data-act="tab" data-v="${G.joined ? 'res' : 'sel'}">${G.joined ? 'Voir les résultats ›' : 'Valider mes choix ›'}</button>
      <button class="ghost" data-act="greset">Recommencer mes choix</button></div>`;
  }
  const ctx = { group: true, playing: G.playing, date: new Date(D.jourISO + 'T00:00:00'), others: othersHTML };
  const num = all.length - rest.length + 1, top = rest[0], next = rest[1]; _deckAll = all;
  return h + `<div class="stage cards">${next ? cardHTML(next, num + 1, all.length, false, ctx) : ''}${cardHTML(top, num, all.length, true, ctx)}</div>
    ${underBar(G.hist.length > 0, 'gundo', 'gfinish', 'J’ai fini')}`;
}
function gDecide(dir) {
  flyOut(dir, id => {
    const M = G.me, prev = M.coeur || null; _swipes++;
    M.kept = M.kept.filter(x => x !== id); M.removed = M.removed.filter(x => x !== id);
    (dir === 'nope' ? M.removed : M.kept).push(id);
    if (dir === 'coeur') {
      if (prev && prev !== id) toast(`Ton coup de cœur passe de « ${(filmById(prev) || {}).t || '?'} » à celui-ci`);
      M.coeur = id;
    }
    G.hist.push({ id, prev }); G.playing = null;
    saveMine();
    if (!gDeck().rest.length) { G.tab = G.joined ? 'res' : 'sel'; window.scrollTo(0, 0); }
    renderGroup();
  });
}
function gUndo() {
  const h = G.hist.pop(); if (!h) return;
  const M = G.me;
  M.kept = M.kept.filter(x => x !== h.id); M.removed = M.removed.filter(x => x !== h.id);
  M.coeur = h.prev; G.playing = null; G.tab = 'films';
  saveMine(); renderGroup();
}
/* Étape 2 : ma sélection (valider / inviter) */
function inviteCard() {
  return `<div class="invcard"><h2>Ta séance est prête !</h2>
    <p>Envoie le lien à tes potes : chacun choisit ses films de son côté, sans compte. Les résultats se mettent à jour à chaque réponse.</p>
    <a class="big or" href="${inviteHref()}" target="_blank" rel="noopener">${ICON.send} Inviter mes potes sur WhatsApp</a>
    <button class="linkbtn" data-act="copylink">Copier le lien</button></div>`;
}
function gSelHTML(left) {
  const M = G.me, dispo = myDispo();
  const films = M.kept.map(filmById).filter(Boolean).map(f => ({ ...f, s: seasFrom(f, dispo) }));
  const removed = M.removed.map(filmById).filter(Boolean);
  let h = '';
  if (G.joined && isCreator() && !ended()) h += inviteCard();
  else if (G.joined) h += `<div class="okcard">${ICON.oks}<span>Tes choix sont validés : tes potes les voient dans les résultats.</span></div>`;
  h += `<div class="pagehead2"><h1>Ma sélection</h1><p>${films.length} film${films.length > 1 ? 's' : ''}${G.joined ? ' · dispo ' + esc(fromText(M.dispo)) : ''}</p></div>`;
  h += films.length ? selGrid(films, M.coeur, 'gunkeep')
    : `<p class="msg">Tu n’as gardé aucun film${G.joined ? '.' : ' pour l’instant. Tu peux quand même valider : tes potes sauront que rien ne te tente.'}</p>`;
  h += removedHTML(removed, 'grekeep', G.showRemoved);
  if (ended()) return h;
  if (M.kept.length || M.removed.length) h += `<button class="linkbtn restart" data-act="greset">${ICON.undo} Recommencer mes choix</button>`;
  if (!G.joined) {
    h += `<div class="ctabar"><button class="big or" data-act="valid">Valider mes choix</button>
      ${left ? `<button class="linkbtn" data-act="tab" data-v="films">Continuer à choisir (${left} film${left > 1 ? 's' : ''} restant${left > 1 ? 's' : ''})</button>` : ''}
      ${!isCreator() ? '<button class="linkbtn" data-act="gabsent">Finalement, pas dispo ce jour-là ?</button>' : ''}</div>`;
  } else {
    h += `<div class="ctabar"><button class="big cream" data-act="tab" data-v="res">Voir les résultats ›</button>
      <button class="linkbtn" data-act="tab" data-v="films">Modifier mes choix</button></div>`;
    if (!isCreator()) h += `<a class="gbtn" href="${inviteHref()}" target="_blank" rel="noopener">${ICON.send} Inviter d’autres potes</a>`;
    else h += cancelLink();
  }
  return h;
}

}
function relanceHref() {

function gDecHTML() {
  const dc = G.doc.decision; if (!dc) return '';
  const f = filmById(dc.filmId), book = safeUrl(dc.book);
  return `<div class="decban"><span class="kick">C’EST DÉCIDÉ !</span><h2>${esc(dc.t)}</h2>
    <p>${esc(G.doc.jour)} à ${esc(dc.h)}${dc.v !== 'VF' ? ' · ' + esc(dc.v) : ''}${dc.fx ? ' · ' + esc(dc.fx) : ''}${f && f.d ? ' · ' + fmtDur(f.d) : ''}<br>${esc(G.doc.cinema.name)}</p>

    ${isCreator() && !ended() ? '<button class="linkbtn" data-act="gundecide">Changer d’avis</button>' : ''}</div>`;
}

/* Étape 3 : résultats */
/* « Pas dispo cette fois » : enregistré avec une heure négative (-1 à -4 = numéro du petit mot choisi),
   ce qui évite de changer les règles Firestore. */
const ABSENT_MSG = [
  'Je garde le pop-corn au chaud pour la prochaine !',
  'Pas dispo cette fois… racontez-moi la fin (sans spoiler) !',
  'Je passe mon tour, mais la prochaine fois c’est moi qui choisis !',
  'Coincé ce jour-là. Profitez bien de la séance !'
];
const isAbsent = p => !!p && typeof p.dispo === 'number' && p.dispo < 0;
const absentMsg = p => ABSENT_MSG[-p.dispo - 1] || ABSENT_MSG[0];
const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;
const listNames = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' et ' + a[a.length - 1];
function gResults() {
  const all = potesList(), P = all.filter(p => !isAbsent(p)), absents = all.filter(isAbsent), n = P.length;
  const common = Math.max(0, ...P.map(p => p.dispo || 0));   // heure où tout le monde est dispo
  const rows = G.doc.films.map(f => {
    const fans = P.filter(p => (p.kept || []).includes(f.id));
    const coeurs = P.filter(p => p.coeur === f.id);
    return { f, fans, coeurs, seas: seasFrom(f, common), score: fans.length + coeurs.length };
  }).filter(r => r.fans.length)
    .sort((a, b) => (b.seas.length > 0) - (a.seas.length > 0) || b.score - a.score || b.fans.length - a.fans.length || a.f.t.localeCompare(b.f.t, 'fr'));
  const matches = n >= 2 ? rows.filter(r => r.fans.length === n && r.seas.length) : [];
  const pool = matches.length ? matches : rows.filter(r => r.seas.length);
  const tied = pool.length ? pool.filter(r => r.score === pool[0].score) : [];
  const leader = matches[0] || pool[0] || rows[0] || null;
  return { all, P, absents, n, common, rows, matches, tied, leader };
}
const filmImg = f => wideImg(f) || safeUrl(f.poster);
const bgStyle = img => img ? ` style="background-image:url(${img})"` : '';
const playBtn = (f, cls) => f.yt ? `<button class="${cls}" data-act="video" data-v="${esc(f.yt)}" aria-label="Bande-annonce de ${esc(f.t)}">${ICON.play}</button>` : '';
const avatars = P => `<span class="avs">${P.map((p, i) => `<span class="av" style="background:${AVC[i % AVC.length]}">${initial(p.prenom)}</span>`).join('')}</span>`;
const seasChips = r => r.seas.length ? r.seas.map(x => `<span class="chip">${chipIn(x)}</span>`).join('') : '<span class="nosea">Pas de séance quand tout le monde est dispo</span>';
/* 1 · Le film en tête, en grand */
function leaderHTML(r, R) {
  const f = r.f, isMatch = R.matches.includes(r), pct = R.n ? Math.round(r.fans.length / R.n * 100) : 0;
  return `<div class="lead">
    <div class="lmedia"${bgStyle(filmImg(f))}><span class="ltag">${isMatch ? 'EN TÊTE · TOUT LE MONDE PARTANT' : 'EN TÊTE'}</span>${playBtn(f, 'lplay')}</div>
    <div class="lbody">
      <div class="lhead"><span class="lt">${esc(f.t)}</span><span class="ld">${f.d ? fmtDur(f.d) : ''}</span></div>
      <div class="lbar"><span class="bar"><span style="width:${pct}%"></span></span>${r.fans.length}/${R.n} partant${r.fans.length > 1 ? 's' : ''}</div>
      <div class="lwho">${r.fans.map(p => esc(p.prenom)).join(', ')}${r.coeurs.length ? ` · ${ICON.hs} coup de cœur de ${r.coeurs.map(p => esc(p.prenom)).join(', ')}` : ''}</div>
      <div class="lseas"><small>SÉANCES QUI VONT À TOUT LE MONDE</small>${seasChips(r)}</div>
      ${isCreator() && r.seas.length && !ended() ? `<button class="big or" data-act="gsheet" data-v="${esc(f.id)}">C’est décidé : on va voir celui-là</button>`
        : !isCreator() ? `<p class="lnote">C’est ${esc(G.doc.auteur)} qui validera le choix final.</p>` : ''}
    </div></div>`;
}
/* 2 · Égalité en tête : la roulette */
function tieHTML(R, meAbsent) {
  const T = R.tied.slice(0, 4), rl = G.doc.roulette, pts = T[0].score;
  return `<div class="tiehead"><span class="kick">ÉGALITÉ EN TÊTE</span><b>${T.length} films à ${plural(pts, 'point')}</b></div>
    <div class="tiegrid">${T.map(r => { const won = rl && rl.filmId === r.f.id; return `<div class="tcard${won ? ' won' : ''}">
      <div class="tmedia"${bgStyle(filmImg(r.f))}>${won ? '<span class="ltag or">LA ROULETTE A CHOISI</span>' : ''}${playBtn(r.f, 'lplay sm')}</div>
      <div class="tbody"><b>${esc(r.f.t)}</b><span class="td">${r.f.d ? fmtDur(r.f.d) : ''}</span>
        <span class="tf">${r.fans.length}/${R.n} partant${r.fans.length > 1 ? 's' : ''}${r.coeurs.length ? ' · ' + ICON.hs : ''}</span>
        <span class="ts">${r.seas.map(x => esc(lab(x))).join(' · ')}</span>
        ${isCreator() && r.seas.length && !ended() ? `<button class="decide sm" data-act="gsheet" data-v="${esc(r.f.id)}">Choisir</button>` : ''}</div></div>`; }).join('')}</div>
    ${G.joined && !meAbsent && !ended() ? `<button class="roulbtn" data-act="groulette">${ICON.dice}<span><b>${rl ? 'Relancer la roulette' : 'Lancer la roulette'}</b><small>tout le monde verra le résultat</small></span></button>` : ''}
    <p class="msg" style="text-align:center">${isCreator() ? 'Ou choisis toi-même : touche « Choisir » sur un des films.' : `C’est ${esc(G.doc.auteur)} qui validera le choix final.`}</p>`;
}
/* 3 · C'est décidé : le billet */
function ticketHTML(R) {
  const D = G.doc, dc = D.decision, f = filmById(dc.filmId), book = safeUrl(dc.book);
  const goers = R.P.map(p => esc(p.prenom) + (p.uid === G.uid ? ' (toi)' : ''));
  return `<div class="ticket">
    <div class="thead"><span>C’est décidé !</span><small>BILLET POUR ${R.n || 1}</small></div>
    ${f && filmImg(f) ? `<div class="tmedia2"${bgStyle(filmImg(f))}>${playBtn(f, 'lplay')}</div>` : ''}
    <div class="tinfo"><b>${esc(dc.t)}</b>
      <span>${esc(D.jour.replace(/^./, c => c.toUpperCase()))} · ${esc(dc.h)}${dc.v !== 'VF' ? ' · ' + esc(dc.v) : ''}${dc.fx ? ' · ' + esc(dc.fx) : ''}${f && f.d ? ' · ' + fmtDur(f.d) : ''}</span>
      <small>${esc(D.cinema.name)}</small></div>
    ${G.joined && isAbsent(G.me) ? '' : `<div class="tacts">${book ? `<a class="big ink" href="${book}" target="_blank" rel="noopener">Réserver ma place</a>` : ''}
      <a class="big or" href="${decisionHref()}" target="_blank" rel="noopener">${ICON.send} Prévenir le groupe sur WhatsApp</a></div>`}
  </div>
  ${goers.length ? `<div class="rstat">${avatars(R.P)}<span>${listNames(goers)} ${goers.length > 1 ? 'y vont' : 'y va'}</span></div>` : ''}
  ${isCreator() && !ended() ? '<button class="linkbtn" data-act="gundecide" style="align-self:center">Changer d’avis</button>' : ''}`;
}
function otherRow(r, n, rank) {
  const f = r.f, pct = n ? Math.round(r.fans.length / n * 100) : 0, img = filmImg(f);
  const thumb = f.yt ? `<button class="othumb"${bgStyle(img)} data-act="video" data-v="${esc(f.yt)}" aria-label="Bande-annonce de ${esc(f.t)}">${ICON.play}</button>` : `<span class="othumb"${bgStyle(img)}></span>`;
  return `<div class="orow"><span class="ork">${rank}</span>${thumb}
    <span class="obody"><b>${esc(f.t)}</b><span class="obar"><span class="bar"><span style="width:${pct}%"></span></span>${r.fans.length}/${n}${r.coeurs.length ? ' ' + ICON.hs : ''}</span>
      <small>${r.fans.map(p => esc(p.prenom)).join(', ')}${r.seas.length ? '' : ' · pas de séance commune'}</small></span>
    ${isCreator() && r.seas.length && !G.doc.decision && !ended() ? `<button class="ochoose" data-act="gsheet" data-v="${esc(f.id)}" aria-label="Choisir ${esc(f.t)}">Choisir</button>` : ''}</div>`;
}
function gResHTML() {
  const R = gResults(), { P, n, absents } = R, D = G.doc, dc = D.decision;
  const meAbsent = G.joined && isAbsent(G.me);
  let h = dc ? '' : `<div class="rstat"><span>${n ? plural(n, 'réponse') : 'Pas encore de réponse'}${absents.length ? ` · ${absents.length} pas dispo` : ''}${n >= 2 && !dc ? ` · séances ${esc(fromText(R.common))}` : ''}</span>${avatars(P)}</div>`;
  if (meAbsent) h += `<div class="okcard"><span>Tu as prévenu que tu n’étais pas dispo : « ${esc(absentMsg(G.me))} »</span><button class="smallbtn" data-act="gviens">Finalement je viens !</button></div>`;
  let shown = new Set(), rank = 1;
  if (dc) { h += ticketHTML(R); shown.add(dc.filmId); }
  else if (n <= 1) {
    h += `<div class="waitcard"><b>En attente des réponses de tes potes…</b>
      <span>Les résultats se remplissent ici à chaque fois qu’un pote valide ses choix.</span>
      ${!ended() ? `<a class="big or" href="${inviteHref()}" target="_blank" rel="noopener">${ICON.send} Inviter mes potes sur WhatsApp</a>` : ''}</div>`;
  } else if (R.tied.length >= 2) { h += tieHTML(R, meAbsent); R.tied.slice(0, 4).forEach(r => shown.add(r.f.id)); rank = shown.size + 1; }
  else if (R.leader) { h += leaderHTML(R.leader, R); shown.add(R.leader.f.id); rank = 2; }
  const others = R.rows.filter(r => !shown.has(r.f.id));
  if (others.length) h += `<div class="sec"><h2>${n <= 1 ? 'Tes films gardés' : dc ? 'Les autres films' : 'Les autres films'}</h2>${others.map((r, i) => otherRow(r, n, dc ? i + 1 : rank + i)).join('')}</div>`;
  if (absents.length) h += `<div class="sec"><h2>Pas dispo cette fois</h2>${absents.map(p => `<div class="abs"><span class="av" style="background:#555;color:#fff">${initial(p.prenom)}</span><span><b>${esc(p.prenom)}${p.uid === G.uid ? ' (toi)' : ''}</b> « ${esc(absentMsg(p))} »</span></div>`).join('')}</div>`;
  if (n >= 2) {
    h += `<button class="rowlink" data-act="gchoix" aria-expanded="${!!G.openChoix}">${dc ? 'Le détail des votes' : 'Voir les choix de chacun'}<span>${G.openChoix ? '▾' : '›'}</span></button>`;
    if (G.openChoix) h += P.map((p, i) => {
      const kept = (p.kept || []).filter(id => id !== p.coeur).map(id => (filmById(id) || {}).t).filter(Boolean);
      return `<div class="pcard"><div class="ph"><span class="av" style="background:${AVC[i % AVC.length]}">${initial(p.prenom)}</span>${esc(p.prenom)}${p.uid === G.uid ? ' (toi)' : ''}
          ${p.uid === D.creator ? '<span class="tag or">ORGANISE</span>' : ''}<small>dispo ${esc(fromText(p.dispo))}</small></div>
        <div class="pl">${p.coeur && filmById(p.coeur) ? `${ICON.hs} <b>${esc(filmById(p.coeur).t)}</b>${kept.length ? '<br>' : ''}` : ''}${kept.length ? kept.map(esc).join(' · ') : p.coeur ? '' : 'Aucun film gardé'}</div></div>`;
    }).join('');
  }
  if (!ended()) {
    if (n > 1 || absents.length) h += `<a class="gbtn" href="${inviteHref()}" target="_blank" rel="noopener">${ICON.send} Inviter d’autres potes</a>`;
    if (!dc && n >= 1) h += `<a class="ghost relance" href="${relanceHref()}" target="_blank" rel="noopener">Relancer ceux qui n’ont pas répondu</a>`;
    if (isCreator()) h += cancelLink();
  }
  h += `<a class="ghost" style="display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff" href="${base()}">Voir toutes les séances</a>`;
  return h;
}
/* Pas dispo cette fois */
function absentSheetBody() {
  if (VAL.prenom == null) VAL.prenom = S.prenom;
  if (VAL.abs == null) VAL.abs = 0;
  return `<h2>Pas dispo cette fois ?</h2>
    <p class="note">Pas de souci ! Préviens tes potes avec un petit mot :</p>
    <label class="field">Ton prénom<input id="v-prenom" type="text" maxlength="30" autocomplete="given-name" value="${esc(VAL.prenom)}" placeholder="Ex. : Julie"></label>
    <div class="lbl">TON PETIT MOT</div>
    ${ABSENT_MSG.map((m, i) => `<button class="opt${i === VAL.abs ? ' on' : ''}" data-act="vabs" data-v="${i}" aria-pressed="${i === VAL.abs}">${esc(m)}</button>`).join('')}
    <button class="big ink" data-act="gabsentok" style="margin-top:10px">Prévenir mes potes</button>`;
}
async function gAbsent(btn) {
  const prenom = String(VAL.prenom || '').trim();
  if (!prenom) { toast('Écris ton prénom'); document.getElementById('v-prenom')?.focus(); return; }
  S.prenom = prenom; store.set('cine:prenom', prenom);
  const before = { ...G.me };
  G.me = { prenom, dispo: -(Number(VAL.abs || 0) + 1), kept: [], removed: [], coeur: null, done: true };
  btn.disabled = true; btn.textContent = 'Envoi…';
  try { await saveMe(); }
  catch (e) { console.error(e); G.me = before; toast('Ton message n’a pas pu être envoyé. Réessaie.'); btn.disabled = false; btn.textContent = 'Prévenir mes potes'; return; }
  G.joined = true; G.sheet = null; G.tab = 'res'; store.del(gKey());
  renderGroup(); window.scrollTo(0, 0);
  toast('C’est noté : tes potes verront ton petit mot');
}
async function gComeBack(btn) {
  /* On efface le « pas dispo » : le pote refait le parcours normal (films, puis prénom + heure à la validation) */
  if (btn) { btn.disabled = true; btn.textContent = 'Un instant…'; }
  try { const fb = await getFB(); await fb.fs.deleteDoc(fb.fs.doc(fb.db, 'seances', G.code, 'potes', fb.uid)); }
  catch (e) { console.error(e); toast('Connexion perdue. Réessaie.'); if (btn) { btn.disabled = false; btn.textContent = 'Finalement je viens !'; } return; }
  delete G.potes[G.uid];
  G.joined = false; G.me = { prenom: G.me.prenom, dispo: 0, kept: [], removed: [], coeur: null, done: false }; G.hist = [];
  G.tab = 'films'; renderGroup(); window.scrollTo(0, 0);
  toast('Super ! Choisis tes films');
}
function absentCardHTML() {
  return `<div class="empty"><h2>Pas dispo cette fois</h2>
    <p class="msg">Tu as prévenu tes potes : « ${esc(absentMsg(G.me))} »</p>
    ${!ended() ? '<button class="big or" data-act="gviens">Finalement je viens !</button>' : ''}
    <button class="ghost" data-act="tab" data-v="res">Voir les résultats</button></div>`;
}

/* Feuilles du mode entre potes : validation, et choix final de l'organisateur */
function gSheetHTML() {
  if (!G.sheet) return '';
  let body = '';
  if (G.sheet === 'valid') body = validSheetBody(true);
  else if (String(G.sheet).startsWith('seas:')) body = allSeasHTML(deckFor(myDispo()).find(x => x.id === G.sheet.slice(5)), G.doc.jour.replace(/^./, c => c.toUpperCase()), myDispo() ? fromText(myDispo()) : gToday() ? 'à venir' : 'dans la journée');
  else if (G.sheet === 'absent') body = absentSheetBody();
  else if (G.sheet === 'cancel') {
    body = `<h2>Annuler la séance ?</h2>
      <p class="note">Tes potes verront que la séance est annulée, et tous les choix (les tiens et les leurs) seront effacés. Tu ne pourras pas revenir en arrière.</p>
      <button class="big red" data-act="gcancelok">Oui, tout annuler</button>
      <button class="ghost" data-act="close" style="margin-top:8px">Non, garder la séance</button>`;
  } else {
    const r = gResults().rows.find(x => x.f.id === G.sheet.slice(2)); if (!r) { G.sheet = null; return ''; }
    body = `<h2>C’est décidé ?</h2>
      <p class="note"><b>${esc(r.f.t)}</b> · ${esc(G.doc.jour)}<br>Choisis la séance : tout le groupe verra le choix, avec le lien pour réserver.</p>` +
      r.seas.map((x, i) => `<button class="opt" data-act="gdecideok" data-v="${i}"><span>${chipIn(x)}</span><small>${x.book ? 'réservation en ligne' : ''}</small></button>`).join('');
  }
  return `<div class="sheetbg" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true"><span class="grip"></span>${body}</div>`;
}
async function gSetDecision(i) {
  const r = gResults().rows.find(x => x.f.id === String(G.sheet || '').slice(2)); const x = r && r.seas[i]; if (!x) return;
  G.sheet = null;
  try {
    const fb = await getFB();
    await fb.fs.updateDoc(fb.fs.doc(fb.db, 'seances', G.code), { decision: { filmId: r.f.id, t: r.f.t, h: x.h, v: x.v, fx: x.fx || null, ap: !!x.ap, book: x.book || null, n: Date.now() } });
    toast('C’est décidé ! Préviens le groupe sur WhatsApp'); window.scrollTo(0, 0);
  } catch (e) { console.error(e); toast('Le choix n’a pas pu être enregistré.'); }
  renderGroup();
}
async function gUndecide() {
  try { const fb = await getFB(); await fb.fs.updateDoc(fb.fs.doc(fb.db, 'seances', G.code), { decision: null }); }
  catch (e) { console.error(e); toast('Impossible d’annuler le choix.'); }
}

/* ----- Annuler la séance (organisateur) et remise à zéro ----- */
function cancelLink() {
  return `<button class="linkbtn danger" data-act="gcancel">Annuler la séance</button>`;
}
async function cancelGroup(btn) {
  btn.disabled = true; btn.textContent = 'Annulation…';
  try {
    const fb = await getFB();
    await fb.fs.updateDoc(fb.fs.doc(fb.db, 'seances', G.code), { annulee: true, decision: null, roulette: null });
    G.doc = { ...G.doc, annulee: true, decision: null, roulette: null }; G.sheet = null;
    renderGroup(); window.scrollTo(0, 0);
  } catch (e) {
    console.error(e); toast('Impossible d’annuler la séance. Vérifie ta connexion.');
    btn.disabled = false; btn.textContent = 'Oui, tout annuler';
  }
}
/* Séance annulée ou passée : on efface les choix (sur le téléphone et en ligne) et on repart de zéro */
async function resetGroup() {
  if (G.cleaned) return; G.cleaned = true;
  const lg = store.get('cine:lastGroup', null);
  if (lg && lg.code === G.code) store.del('cine:lastGroup');
  store.del(`cine:${G.doc.cinema.id}:${G.doc.jourISO}`);
  store.del(gKey());
  try {
    const fb = await getFB();
    const ids = isCreator() ? [...new Set([...Object.keys(G.potes), G.uid])] : G.joined ? [G.uid] : [];
    await Promise.all(ids.map(uid => fb.fs.deleteDoc(fb.fs.doc(fb.db, 'seances', G.code, 'potes', uid)).catch(() => {})));
  } catch (e) { console.warn(e); }
}
function renderOver() {
  G.over = true; resetGroup();
  const D = G.doc, dc = D.decision, cancelled = isCancelled();
  $app.innerHTML = BRAND + `<div class="over">
    <h2>${cancelled ? 'Séance annulée' : 'Séance terminée 🍿'}</h2>
    <p>${cancelled
      ? `${isCreator() ? 'Tu as annulé' : esc(D.auteur) + ' a annulé'} la séance du ${esc(D.jour)} au ${esc(D.cinema.short)}.`
      : dc ? `Le film choisi pour le ${esc(D.jour)} : <b>${esc(dc.t)}</b> à ${esc(dc.h)}, au ${esc(D.cinema.short)}.` : `La séance du ${esc(D.jour)} au ${esc(D.cinema.short)} est passée.`}</p>
    <p>Tous les choix ont été remis à zéro.</p>
    <a class="big or" href="${base()}">Choisir un nouveau film</a></div>` + CREDIT;
}

/* D : la roulette (le résultat est partagé : tout le monde voit la même animation) */
async function spinRoulette() {
  const { tied } = gResults(); if (tied.length < 2) return;
  const pick = tied[crypto.getRandomValues(new Uint32Array(1))[0] % tied.length];
  try {
    const fb = await getFB();
    await fb.fs.updateDoc(fb.fs.doc(fb.db, 'seances', G.code), { roulette: { filmId: pick.f.id, pool: tied.map(r => r.f.id), by: G.me ? G.me.prenom : S.prenom, n: Date.now() } });
  } catch (e) { console.error(e); toast('La roulette n’a pas pu être lancée.'); }
}
function playRoulette(r) {
  const titles = (r.pool || []).map(id => (filmById(id) || {}).t).filter(Boolean);
  const win = (filmById(r.filmId) || {}).t; if (!win || titles.length < 2) return;
  document.querySelector('.roul')?.remove();
  const o = document.createElement('div'); o.className = 'roul'; o.setAttribute('role', 'dialog');
  o.innerHTML = `<span class="kick">ROULETTE LANCÉE PAR ${esc(String(r.by || '').toUpperCase())}</span><div class="rt" aria-live="polite"></div>
    <button class="big or" data-act="roulclose" style="visibility:hidden;max-width:320px">Super !</button>`;
  document.body.appendChild(o);
  const rt = o.querySelector('.rt'), seq = [];
  const k = Math.floor(Math.random() * titles.length);
  for (let s = 0; s < 21; s++) seq.push(titles[(k + s) % titles.length]);
  if (seq[seq.length - 1] === win) seq.push(titles.find(t => t !== win));
  seq.push(win);
  let i = 0;
  const tick = () => {
    rt.textContent = seq[i];
    if (i === seq.length - 1) {
      rt.classList.add('win'); o.querySelector('.kick').textContent = 'LA ROULETTE A CHOISI';
      o.querySelector('button').style.visibility = 'visible';
      if (navigator.vibrate) navigator.vibrate(80);
      return;
    }
    i++; setTimeout(tick, 55 + i * i * 0.8);
  };
  tick();
}

/* ---------- Actions ---------- */
function render() {
  if (G.on) return renderGroup();
  if (V.on) return renderShared();
  if (!S.cin) return renderPickPage();
  if (!DATA[S.cin]) { loadCinema(S.cin); return; }
  renderHome();
}
function switchTab(v) {
  if (G.on) {
    if (v === 'res' && !G.joined && !ended()) { toast('Valide d’abord tes choix pour voir les résultats'); v = 'sel'; }
    G.tab = v; G.playing = null; G.sheet = null; renderGroup();
  } else {
    if (v === 'res') { toast('Les résultats s’ouvrent quand tu as validé tes choix et invité tes potes'); v = 'sel'; }
    S.tab = v; S.playing = null; S.sheet = null; render();
  }
  window.scrollTo(0, 0);
}
document.addEventListener('input', e => {
  if (e.target.id === 'f-prenom') S.prenom = e.target.value;
  if (e.target.id === 'f-mot') S.mot = e.target.value;
  if (e.target.id === 'f-prenom' || e.target.id === 'f-mot') { const pv = document.getElementById('f-preview'); if (pv) pv.textContent = buildMsg(payload(), '[lien]'); }
  if (e.target.id === 'v-prenom') VAL.prenom = e.target.value;
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case 'tab': switchTab(v); break;
    case 'sheet': S.sheet = v; render(); break;
    case 'close': if (G.on) G.sheet = null; else S.sheet = null; render(); break;
    case 'allseas': if (G.on) { G.sheet = 'seas:' + v; renderGroup(); } else { S.sheet = 'seas:' + v; render(); } break;
    /* Réglages : le panneau reste ouvert, la liste se met à jour derrière */
    case 'setcin': useCinema({ id: v, name: b.dataset.n || v, city: b.dataset.c || '' }); render(); break;
    case 'fav': toggleFav({ id: v, name: b.dataset.n || v, city: b.dataset.c || '' }); break;
    case 'installClose': document.querySelector('.intro.inst')?.remove(); break;
    case 'pickcin': useCinema({ id: v, name: b.dataset.n || v, city: b.dataset.c || '' }); S.sheet = null; render(); window.scrollTo(0, 0); break;
    case 'near': nearMe(); break;
    case 'neartown': nearPlace(Number(b.dataset.lat), Number(b.dataset.lon), b.dataset.label || ''); break;
    case 'cityall': cityList(v, b.dataset.label || ''); break;
    case 'intro': showIntro(); break;
    case 'introNext': introStep(1); break;
    case 'introEnd': closeIntro(); break;
    case 'install': installApp(); break;
    case 'setday': S.day = Number(v); if (S.day !== 0 && S.hour === -1) S.hour = 0; S.playing = null; S.tab = 'films'; keepSheet(render); break;
    case 'sethour': S.hour = Number(v); S.playing = null; S.tab = 'films'; keepSheet(render); break;
    case 'nextday': S.day = Math.min(S.day + 1, LIMIT); if (S.hour === -1) S.hour = 0; render(); break;
    case 'allday': S.hour = 0; render(); break;
    case 'decide': decide(v); break;
    case 'undo': undo(); break;
    case 'finish': switchTab('sel'); break;
    case 'stop': if (G.on) G.playing = null; else S.playing = null; render(); break;
    case 'reset': if (!confirmReset()) break; saveList({ kept: [], removed: [], hist: [] }); S.tab = 'films'; render(); window.scrollTo(0, 0); toast('C’est reparti : tous les films sont de retour'); break;
    case 'unkeep': { const L = getList(); L.kept = L.kept.filter(x => x !== v); L.removed.push(v); if (L.coeur === v) L.coeur = null; saveList(L); render(); break; }
    case 'rekeep': { const L = getList(); L.removed = L.removed.filter(x => x !== v); L.kept.push(v); saveList(L); render(); break; }
    case 'toggleRemoved': if (G.on) { G.showRemoved = !G.showRemoved; renderGroup(); } else { S.showRemoved = !S.showRemoved; render(); } break;
    case 'share': share(); break;
    case 'video': showVideo(v); break;
    case 'retry': loadCinema(S.cin, true); break;
    case 'closevideo': b.closest('.vid')?.remove(); if (G.on && G.tab === 'res') onGroupChange(); break;
    /* Validation (prénom + heure) */
    case 'valid': VAL.dispo = null; if (G.on) { G.sheet = 'valid'; renderGroup(); } else { S.sheet = 'valid'; render(); } break;
    case 'vdispo': {
      VAL.dispo = Number(v); document.querySelectorAll('[data-act=vdispo]').forEach(c => { const on = c === b; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); });
      const dl = document.querySelector('.sdial[data-for=valid]'); if (dl) { dl.dataset.label = b.textContent; drawDial(dl, VAL.dispo || DIAL_MIN); }
      break;
    }
    case 'validok': if (G.on) gValidate(b); else createGroup(b); break;
    /* Séance entre potes */
    case 'gdecide': gDecide(v); break;
    case 'gundo': gUndo(); break;
    case 'gfinish': switchTab('sel'); break;
    case 'gunkeep': { const M = G.me; M.kept = M.kept.filter(x => x !== v); M.removed.push(v); if (M.coeur === v) M.coeur = null; saveMine(); renderGroup(); break; }
    case 'grekeep': { const M = G.me; M.removed = M.removed.filter(x => x !== v); M.kept.push(v); saveMine(); renderGroup(); break; }
    case 'greset':
      if (!G.me || !confirmReset()) break;
      Object.assign(G.me, { kept: [], removed: [], coeur: null }); G.hist = [];
      saveMine(); G.tab = 'films'; renderGroup(); window.scrollTo(0, 0); toast('C’est reparti : tous les films sont de retour'); break;
    case 'copylink':
      (navigator.clipboard ? navigator.clipboard.writeText(groupLink()) : Promise.reject()).then(() => toast('Lien copié : colle-le où tu veux'), () => toast(groupLink()));
      break;
    case 'gsheet': G.sheet = 'd:' + v; renderGroup(); break;
    case 'gdecideok': gSetDecision(Number(v)); break;
    case 'gundecide': gUndecide(); break;
    case 'gcancel': G.sheet = 'cancel'; renderGroup(); break;
    case 'gcancelok': cancelGroup(b); break;
    case 'groulette': spinRoulette(); break;
    case 'gchoix': G.openChoix = !G.openChoix; { const gb = document.getElementById('gbody'); if (gb) gb.innerHTML = gResHTML(); } break;
    case 'gabsent': VAL.prenom = null; VAL.abs = null; G.sheet = 'absent'; renderGroup(); break;
    case 'vabs': VAL.abs = Number(v); document.querySelectorAll('[data-act=vabs]').forEach(c => { const on = c === b; c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); }); break;
    case 'gabsentok': gAbsent(b); break;
    case 'gviens': gComeBack(b); break;
    case 'roulclose': b.closest('.roul')?.remove(); onGroupChange(); break;
  }
});
/* Petite confirmation intégrée (pas de fenêtre du navigateur) : il faut toucher 2 fois */
let _resetArmed = 0;
function confirmReset() {
  if (Date.now() - _resetArmed < 4000) { _resetArmed = 0; return true; }
  _resetArmed = Date.now(); toast('Touche encore une fois pour effacer tes choix et recommencer'); return false;
}
document.addEventListener('keydown', e => {
  // Flèches du clavier : ← non merci, → je garde, ↑ coup de cœur
  const arrows = { ArrowLeft: 'nope', ArrowRight: 'keep', ArrowUp: 'coeur' };
  if (arrows[e.key] && !e.target.closest('input,textarea') && document.querySelector('.card.front') && !document.querySelector('.sheet, .vid, .roul')) {
    e.preventDefault();
    if (G.on) { if (G.tab === 'films') gDecide(arrows[e.key]); } else if (S.tab === 'films') decide(arrows[e.key]);
    return;
  }
  if (e.key !== 'Escape') return;
  const vid = document.querySelector('.vid'); if (vid) { vid.remove(); return; }
  const rou = document.querySelector('.roul'); if (rou) { rou.remove(); onGroupChange(); return; }
  if (document.querySelector('.intro')) { closeIntro(); return; }
  if (G.on && G.sheet) { G.sheet = null; renderGroup(); return; }
  if (S.sheet) { S.sheet = null; render(); }
});
window.addEventListener('popstate', () => location.reload());

/* ---------- Démarrage ---------- */
(function purgeOld() {
  const t = iso(new Date());
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i); if (!k) continue;
      const m = /^cine:[A-Za-z0-9]+:(\d{4}-\d{2}-\d{2})$/.exec(k);
      if (m && m[1] < t) localStorage.removeItem(k);                       // choix d'un jour passé
      if (/^cine:g:/.test(k)) { const v = store.get(k, null); if (!v || !v.jour || v.jour < t) localStorage.removeItem(k); }
    }
    const lg = store.get('cine:lastGroup', null);
    if (lg && (lg.jour < t || (lg.fin && lg.fin < Date.now()))) {        // séance terminée : remise à zéro
      store.del('cine:lastGroup'); if (lg.cin) store.del(`cine:${lg.cin}:${lg.jour}`);
    }
  } catch (e) {}
})();
(() => {
  const code = (new URLSearchParams(location.search).get('g') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  if (code) { initGroup(code); return; }
  if (initShared()) return;
  render();
})();
</script>
